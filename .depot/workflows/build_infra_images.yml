name: Build Infrastructure Images

on:
  # Auto-build disabled during Depot trial to avoid colliding with GitHub Actions. Manual dispatch only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: "Detect Changes 🔍"
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - id: find
        name: Find changed infra images
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images=$(find infra -name Dockerfile -printf '%h\n' | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            changed_dirs=$(git diff --name-only HEAD~1 HEAD -- infra/ | cut -d/ -f2 | sort -u)
            images="[]"
            for dir in $changed_dirs; do
              if [ -f "infra/$dir/Dockerfile" ]; then
                images=$(echo "$images" | jq -c ". + [\"$dir\"]")
              fi
            done
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.image }} 🐳"
    needs: detect
    if: needs.detect.outputs.images != '[]'
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/polarsource/polar-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ./infra/${{ matrix.image }}
          platforms: linux/amd64
