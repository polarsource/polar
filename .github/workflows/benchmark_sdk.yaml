name: SDK Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - ".github/workflows/benchmark_sdk.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "sdk/python/**"
      - "sdk/typescript/**"
      - ".github/workflows/benchmark_sdk.yaml"
  workflow_dispatch:

# A newer push on the same branch supersedes a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # CodSpeed authenticates the run with OIDC.
  id-token: write

env:
  # CodSpeed profiles Python from 3.12; 3.14 runs this code about as fast as 3.11, 3.12 slower.
  UV_PYTHON: "3.14"
  # CodSpeed traces the interpreter from setup-python; keep uv from downloading its own.
  UV_PYTHON_PREFERENCE: only-system
  # A random hash seed changes dict collisions, hence instruction counts, from run to run.
  PYTHONHASHSEED: "0"

# Instruction counts, on the runners the rest of CI uses, for the pure CPU benchmarks: wall time
# would add noise, not information. Real time, on CodSpeed's dedicated ARM64 machines, for the
# Redis benchmarks, whose cost is in another process, and the warm reads, which a few simulated
# calls would measure cold.
jobs:
  typescript-simulation:
    name: TypeScript SDK (simulation)
    # Draft pull requests run once, when marked ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: sdk/typescript
          run: pnpm vitest bench --run --exclude src/outpost/scripts.bench.ts --exclude src/outpost/ingest.bench.ts --exclude src/outpost/read.bench.ts

  python-simulation:
    name: Python SDK (simulation)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: sdk/python
          run: uv run --no-sync pytest tests/benchmarks --ignore=tests/benchmarks/test_scripts.py --ignore=tests/benchmarks/test_ingest.py --ignore=tests/benchmarks/test_read.py -m benchmark --codspeed

  # Both SDKs in one job: the macro runner minutes are metered, and the setup is most of them.
  walltime:
    name: SDKs (walltime)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: codspeed-macro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install TypeScript dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Install Python dependencies
        working-directory: sdk/python
        run: uv sync --frozen --all-extras

      - name: Install Redis
        uses: shogo82148/actions-setup-redis@v1.58.1
        with:
          redis-version: "7.4"
          auto-start: false

      - name: Run TypeScript benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          working-directory: sdk/typescript
          run: pnpm vitest bench --run src/outpost/scripts.bench.ts src/outpost/ingest.bench.ts src/outpost/read.bench.ts

      - name: Run Python benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          working-directory: sdk/python
          run: uv run --no-sync pytest tests/benchmarks/test_scripts.py tests/benchmarks/test_ingest.py tests/benchmarks/test_read.py -m benchmark --codspeed
