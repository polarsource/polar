name: SDK Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/benchmark_sdk.yaml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/benchmark_sdk.yaml"
  workflow_dispatch:

permissions:
  contents: read
  # CodSpeed authenticates the run with OIDC.
  id-token: write

jobs:
  typescript-sdk:
    name: TypeScript SDK (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Instruction counts: deterministic, on the runners the rest of CI uses. Not for the
          # Redis benchmarks, whose cost is in another process.
          - mode: simulation
            runner: blacksmith-4vcpu-ubuntu-2404
            benchmarks: --exclude src/outpost/scripts.bench.ts
          # Real time: on CodSpeed's dedicated ARM64 machines, registered in the org by the app.
          # Only the Redis benchmarks: wall time adds noise, not information, on pure CPU code.
          - mode: walltime
            runner: codspeed-macro
            benchmarks: src/outpost/scripts.bench.ts
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Redis
        uses: shogo82148/actions-setup-redis@v1.58.1
        with:
          redis-version: "7.4"
          auto-start: false

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          working-directory: sdk/typescript
          run: pnpm vitest bench --run ${{ matrix.benchmarks }}

  python-sdk:
    name: Python SDK (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: simulation
            runner: blacksmith-4vcpu-ubuntu-2404
            benchmarks: tests/benchmarks --ignore=tests/benchmarks/test_scripts.py
          - mode: walltime
            runner: codspeed-macro
            benchmarks: tests/benchmarks/test_scripts.py
    defaults:
      run:
        working-directory: sdk/python
    env:
      # CodSpeed traces the interpreter from setup-python; keep uv from downloading its own.
      UV_PYTHON_PREFERENCE: only-system
      # A random hash seed changes dict collisions, hence instruction counts, from run to run.
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # CodSpeed profiles Python from 3.12: the closest to the version the SDK is tested on.
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install Redis
        uses: shogo82148/actions-setup-redis@v1.58.1
        with:
          redis-version: "7.4"
          auto-start: false

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          working-directory: sdk/python
          run: uv run --no-sync pytest ${{ matrix.benchmarks }} -m benchmark --codspeed
