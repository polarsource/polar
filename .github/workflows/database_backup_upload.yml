name: Upload database backup to S3

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Export date to upload (YYYY-MM-DD), defaults to today
        required: false

permissions:
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: backup
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download backup from Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DATABASE_ID: ${{ secrets.RENDER_DATABASE_ID }}
        run: |
          mkdir -p backups
          BACKUP_DATE="${{ inputs.date }}"
          [[ -n "$BACKUP_DATE" ]] || BACKUP_DATE=$(date -u +%Y-%m-%d)
          echo "BACKUP_DATE=$BACKUP_DATE" >> "$GITHUB_ENV"

          DOWNLOAD_URL=$(curl -fsS "https://api.render.com/v1/postgres/$RENDER_DATABASE_ID/export" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            | jq -r --arg d "$BACKUP_DATE" '[.[] | select(.createdAt | startswith($d))][0].url // empty')

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Error: No export for $BACKUP_DATE found" >&2
            exit 1
          fi

          echo "Downloading database backup..."
          for attempt in $(seq 1 5); do
            curl -fsS -C - -o "backups/${BACKUP_DATE//-/}_backup.tar.gz" "$DOWNLOAD_URL" && break
            echo "Download attempt $attempt failed, resuming in 30 seconds..." >&2
            sleep 30
            [[ "$attempt" -eq 5 ]] && exit 1
          done

          echo "Download completed successfully"

      - name: Upload backup to S3
        env:
          BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          BACKUP_COUNT=$(find backups -name "*.tar.gz" -type f | wc -l)

          if [ "$BACKUP_COUNT" -gt 0 ]; then
            echo "Uploading $BACKUP_COUNT backup file(s) to S3..."

            if ! aws s3 cp backups/*.tar.gz "s3://$BUCKET_NAME/${BACKUP_DATE//-/}/" --checksum-algorithm SHA256 --no-progress; then
              echo "Error: Failed to upload backups to S3" >&2
              exit 1
            fi

            echo "Upload completed successfully"
          else
            echo "Error: No backup files found to upload" >&2
            exit 1
          fi

      - name: Cleanup sensitive data
        if: always()
        run: |
          # Remove any sensitive files regardless of whether steps succeeded
          rm -rf backups/

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C093CJXJXPT",
              "text": "Database backup upload to S3 failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Database backup upload to S3 failed* — the daily PostgreSQL backup could not be downloaded from Render or uploaded to s3://polar-sh-backups. The off-provider backup copy may be missing for today.\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>*"
                  }
                }
              ]
            }
