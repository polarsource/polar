name: Deploy Environment
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (sandbox or production)"
        required: true
        type: string
      render-api-service-id:
        description: "Render API service ID"
        required: true
        type: string
      render-worker-service-ids:
        description: "Comma-separated list of Render worker service IDs"
        required: false
        type: string
        default: ""
      has-migrations:
        description: "Whether this deployment includes database migrations"
        required: false
        type: boolean
        default: false
      skip-backend:
        description: "Skip backend deployment if no backend changes"
        required: false
        type: boolean
        default: false
      skip-frontend:
        description: "Skip frontend deployment if no frontend changes"
        required: false
        type: boolean
        default: false
      frontend-deployment-url:
        description: "Staged Vercel deployment to promote instead of building one here"
        required: false
        type: string
        default: ""
    secrets:
      RENDER_API_TOKEN:
        required: true
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_ORG:
        required: true
    outputs:
      frontend-deployment-url:
        description: "Frontend deployment URL"
        value: ${{ inputs.frontend-deployment-url || jobs.build-frontend.outputs.deployment-url }}

jobs:
  build-frontend:
    name: "Frontend: Build"
    concurrency:
      group: deploy-frontend-build-${{ inputs.environment }}
      cancel-in-progress: true
    if: inputs.skip-frontend != true && inputs.frontend-deployment-url == ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Deploy to Vercel (Staged Production)
        id: deploy
        uses: ./.github/actions/vercel-build
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: "Backend: Deploy to ${{ inputs.environment }}"
    concurrency:
      group: deploy-backend-${{ inputs.environment }}
      cancel-in-progress: false
    if: always() && inputs.skip-backend != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy Backend to Render
        run: |
          ./.github/workflows/deploy_server.sh \
            "${{ steps.tag.outputs.tag }}" \
            "${{ inputs.has-migrations }}" \
            "${{ inputs.render-api-service-id }}" \
            "${{ inputs.render-worker-service-ids }}"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      # Best effort: a missing Sentry release is observability noise, not a
      # deploy regression, and must not fail the job (which would block production).
      - name: Create Sentry release
        uses: getsentry/action-release@v3.7.0
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        with:
          environment: ${{ inputs.environment }}
          dist: ${{ steps.tag.outputs.tag }}
          release: ${{ github.sha }}
          projects: server
          working_directory: ./server

      # The next run's `changes` job diffs against this tag. Main only: a
      # workflow_dispatch from another ref would move the tag off main and
      # poison that diff base. Best effort: a failed advance only means the
      # next push redeploys the same SHA.
      - name: Advance deployed/backend-${{ inputs.environment }} tag
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: deployed/backend-${{ inputs.environment }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  promote-frontend:
    name: "Frontend: Promote to Production"
    concurrency:
      group: deploy-frontend-promotion-${{ inputs.environment }}
      cancel-in-progress: true
    needs: [build-frontend, deploy-backend]
    if: always() && !failure() && !cancelled() && inputs.skip-frontend != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    env:
      DEPLOYMENT_URL: ${{ inputs.frontend-deployment-url || needs.build-frontend.outputs.deployment-url }}
    steps:
      - name: Promote Frontend to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          api() { curl --silent --show-error --fail-with-body --header "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          DEPLOYMENT_ID=$(api "https://api.vercel.com/v13/deployments/${DEPLOYMENT_URL#https://}?teamId=$VERCEL_ORG_ID" | jq --raw-output .id)
          echo "Promoting $DEPLOYMENT_URL ($DEPLOYMENT_ID)"
          api --request POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" --output /dev/null
          # Same as `vercel promote`: wait while the project reports the promotion
          # as pending, treat anything else (including no record of it) as done.
          for _ in $(seq 1 60); do
            STATUS=$(api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              | jq --raw-output --arg id "$DEPLOYMENT_ID" '.lastAliasRequest | select(.toDeploymentId == $id) | .jobStatus')
            case "$STATUS" in
              pending | in-progress) sleep 2 ;;
              failed) echo "Promotion failed"; exit 1 ;;
              *) echo "Promoted $DEPLOYMENT_URL"; exit 0 ;;
            esac
          done
          echo "Promotion of $DEPLOYMENT_URL still $STATUS after two minutes"
          exit 1

      # See the backend tag step.
      - name: Advance deployed/frontend-${{ inputs.environment }} tag
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: deployed/frontend-${{ inputs.environment }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true \
            || gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
