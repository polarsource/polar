name: Deployment Notifications

on:
  workflow_run:
    workflows: [Build and Deploy]
    types: [in_progress, completed]

concurrency:
  group: deployment-notification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.action == 'in_progress' && 360 || 5 }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update deployment thread
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_SLACK_CHANNEL_ID: ${{ vars.DEPLOY_SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          SLACK_USERS_JSON: ${{ vars.SLACK_USERS_JSON }}
        with:
          script: |
            const { notifyDeployment } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/deploy-notify/slack.mjs`);
            await notifyDeployment({ github, context, core, watch: true });
