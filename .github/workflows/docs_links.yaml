name: Docs links

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs_links.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  broken-links:
    name: "Broken links: docs"
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove pnpm-lock.yaml, whose two YAML documents stop Mintlify from generating the API reference pages
        run: rm pnpm-lock.yaml

      - name: 🔗 Check for broken links
        run: node_modules/.bin/mintlify broken-links
