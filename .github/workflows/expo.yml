name: preview
on:
  pull_request:
    paths:
      - clients/apps/app/**

permissions:
  contents: read

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/clients
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Setup EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          working-directory: ${{ github.workspace }}/clients/apps/app
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo run build --filter='@polar-sh/app^...'

      - name: Create preview
        uses: expo/expo-github-action/preview@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          working-directory: ${{ github.workspace }}/clients/apps/app
          command: eas update --auto
