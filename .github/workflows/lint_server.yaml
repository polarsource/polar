name: Server Lint

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/test_server.yaml"
      - ".github/workflows/lint_server.yaml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linters:
    name: "Server: Linters 📝"
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if server changed
        id: server-changes
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git fetch --depth=1 origin "$BASE_SHA" && git diff --quiet "$BASE_SHA" HEAD -- server/ .github/workflows/test_server.yaml .github/workflows/lint_server.yaml; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛟 Cache mypy
        if: steps.server-changes.outputs.should_run != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/.mypy_cache
          key: mypy-v2-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'server/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-v2-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'server/uv.lock') }}-

      - name: Install uv
        if: steps.server-changes.outputs.should_run != 'false'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.server-changes.outputs.should_run != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        if: steps.server-changes.outputs.should_run != 'false'
        working-directory: ./server
        run: uv sync --dev --frozen

      - name: 🐶 Lint Server (ruff)
        if: steps.server-changes.outputs.should_run != 'false'
        working-directory: ./server
        run: uv run task lint_check

      - name: 🛟 Type Check Server (mypy)
        if: steps.server-changes.outputs.should_run != 'false'
        working-directory: ./server
        run: uv run task lint_types
