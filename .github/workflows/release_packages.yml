name: Release packages

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/clients

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # Stay on action v1 while clients still use @changesets/cli v2.
        # v2 of this action requires CLI v3 and dropped the `publish`/`cwd` inputs
        # (see https://github.com/changesets/action/issues/501).
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm release-packages
          cwd: ${{ github.workspace }}/clients
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLAR_CHECKOUT_EMBED_SCRIPT_ALLOWED_ORIGINS: "https://polar.sh,https://sandbox.polar.sh"

      - name: Release summary
        if: always() && steps.changesets.outcome != 'skipped'
        run: |
          {
            echo "## Release packages"
            echo "- Changesets present: \`${{ steps.changesets.outputs.hasChangesets }}\`"
            echo "- Published: \`${{ steps.changesets.outputs.published }}\`"
            echo "- Version PR: \`${{ steps.changesets.outputs.pullRequestNumber }}\`"
            echo "- Published packages: \`${{ steps.changesets.outputs.publishedPackages }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
