name: SDK Release
concurrency: sdk-release

on:
  push:
    branches: [main]

# Required for OIDC (Trusted Publishing)
permissions:
  contents: read
  id-token: write

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for release commit
        id: check
        run: |
          if git log --oneline -1 | grep -qP '^.*sdk\[release\]: \K.+'; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from commit message
        if: steps.check.outputs.release == 'true'
        id: extract
        run: |
          version=$(git log --oneline -1 | grep -oP 'sdk\[release\]: \K\S+')
          echo "Extracted version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

  tag:
    needs: detect-release
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create annotated tag
        run: |
          version="${{ needs.detect-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "sdk/$version" -m "SDK Release $version"
          git push origin "sdk/$version"

  publish-python:
    needs: [detect-release, tag]
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: "sdk/${{ needs.detect-release.outputs.version }}"
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build Python SDK
        working-directory: sdk/python
        run: uv build --no-sources

      - name: Publish to PyPI (Trusted Publishing)
        working-directory: sdk/python
        # uv publish automatically uses OIDC in GitHub Actions with id-token: write
        run: uv publish

  publish-typescript:
    needs: [detect-release, tag]
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: "sdk/${{ needs.detect-release.outputs.version }}"
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: pnpm run build

      - name: Publish to npm (Trusted Publishing)
        working-directory: sdk/typescript
        run: npm publish --tag latest

  update-sdk-dependents:
    needs: [detect-release, publish-typescript]
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: clients/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Update adapter and CLI SDK dependencies and add patch changeset
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: node scripts/update-sdk-dependencies.mjs "$RELEASE_VERSION"

      - name: Update lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Create SDK dependency update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sdk/dependents-${{ needs.detect-release.outputs.version }}
          base: main
          draft: true
          commit-message: "chore: update adapters and CLI to SDK ${{ needs.detect-release.outputs.version }}"
          title: "chore: update adapters and CLI to SDK ${{ needs.detect-release.outputs.version }}"
          body: |
            Update all adapters and the CLI to `@polar-sh/sdk@${{ needs.detect-release.outputs.version }}` after its successful npm release.

            Includes updated SDK dependencies and peer dependencies, the pnpm lockfile, and a patch changeset for every adapter and `polar-cli`.
          add-paths: |
            clients/adapters/*/package.json
            clients/packages/cli/package.json
            clients/pnpm-lock.yaml
            clients/.changeset/sdk-${{ needs.detect-release.outputs.version }}.md

  create-github-release:
    needs: [detect-release, publish-python, publish-typescript]
    if: needs.detect-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: "sdk/${{ needs.detect-release.outputs.version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Extract release notes
        working-directory: sdk/generator
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        run: uv run --locked keepachangelog show "$RELEASE_VERSION" ../CHANGELOG.md > "$RUNNER_TEMP/sdk-release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: "sdk/${{ needs.detect-release.outputs.version }}"
          name: "SDK ${{ needs.detect-release.outputs.version }}"
          body_path: ${{ runner.temp }}/sdk-release-notes.md
