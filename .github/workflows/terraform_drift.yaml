name: "Terraform drift"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Terraform Cloud token
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if [ -z "$TF_TOKEN_app_terraform_io" ]; then
            echo "::error::Set the TF_API_TOKEN Actions secret to a Terraform Cloud token with plan access to all checked workspaces."
            exit 1
          fi

  plan:
    name: ${{ matrix.workspace }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - global
          - identity
          - organization
          - production
          - sandbox
          - security
          - test
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
    outputs:
      global: ${{ steps.plan.outputs.global }}
      identity: ${{ steps.plan.outputs.identity }}
      organization: ${{ steps.plan.outputs.organization }}
      production: ${{ steps.plan.outputs.production }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      security: ${{ steps.plan.outputs.security }}
      test: ${{ steps.plan.outputs.test }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/${{ matrix.workspace }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: terraform/${{ matrix.workspace }}
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0)
              echo "### ${{ matrix.workspace }}: No changes" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "### ${{ matrix.workspace }}: Terraform reported changes" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::terraform/${{ matrix.workspace }} has pending changes; review the plan."
              echo "${{ matrix.workspace }}=\`${{ matrix.workspace }}\` (drift)" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "### ${{ matrix.workspace }}: The plan could not complete" >> "$GITHUB_STEP_SUMMARY"
              echo "${{ matrix.workspace }}=\`${{ matrix.workspace }}\` (plan failed)" >> "$GITHUB_OUTPUT"
              ;;
          esac
          exit "$code"

  notify:
    name: Report drift check failure
    needs: [preflight, plan]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.plan.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List failed workspaces
        id: failed
        env:
          PLAN_OUTPUTS: ${{ toJSON(needs.plan.outputs) }}
        run: echo "list=$(jq -r '[.[] | select(. != "")] | join(", ")' <<< "$PLAN_OUTPUTS")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C093CJXJXPT",
              "text": "Terraform drift check needs attention",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Terraform drift check needs attention*\n${{ needs.preflight.result == 'failure' && 'Credential preflight failed. Check the TF_API_TOKEN Actions secret. No workspaces were checked.' || format('Workspaces with pending changes or a failed plan: {0}. Review the failed workspace jobs for details.', steps.failed.outputs.list || 'none reported, a job may have timed out') }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>*"
                  }
                }
              ]
            }
