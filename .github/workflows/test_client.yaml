name: Client

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./clients

permissions:
  contents: read

jobs:
  changes:
    name: "Detect changes"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      clients: ${{ steps.filter.outputs.clients }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            clients:
              - 'clients/**'
              - 'sdk/cli-commands/**'
              - 'docs/integrate/cli/**'
              - 'docs/openapi/**'
              - 'docs/docs.json'
              - '.github/workflows/test_client.yaml'
              - '.github/actions/setup-clients/**'
              - '.github/workflows/release_cli.yml'

  checks:
    name: "Client: Checks 💅"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: 💅 Format check
        run: pnpm run format:check

      - name: 💅 Lint
        run: pnpm run lint

      - name: 🌍 Validate i18n
        run: pnpm --filter @polar-sh/i18n validate

      - name: 👀 Typecheck
        run: pnpm run typecheck

  test-web:
    name: "Client: Test Web 🧪"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: "🧪 Test: Web"
        run: pnpm turbo run test --filter=web

  test-packages:
    name: "Client: Test Packages 🧪"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: "🧪 Test: App"
        run: pnpm turbo run test --filter=@polar-sh/app

      - name: "🧪 Test: @polar-sh/currency"
        run: pnpm turbo run test --filter=@polar-sh/currency

      - name: "🧪 Test: @polar-sh/checkout"
        run: pnpm turbo run test --filter=@polar-sh/checkout

      - name: "🧪 Test: @polar-sh/orbit"
        run: pnpm turbo run test --filter=@polar-sh/orbit

      - name: "🧪 Test: MCP"
        run: pnpm --filter mcp test

      - name: "🧪 Test: Adapters"
        run: pnpm turbo run test --filter='./adapters/*'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: clients/packages/cli/package.json

      - name: "🧪 Test: CLI"
        run: pnpm --filter @polar-sh/cli test

      - name: "📚 CLI docs are up to date"
        run: pnpm --filter @polar-sh/cli docs:check

  build:
    name: "Client: Build 🛠️"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: 🛠️ Build
        run: pnpm build

  status:
    name: "Client: Tests 🎨"
    needs: [changes, checks, test-web, test-packages, build]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done
