name: Client

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./clients

permissions:
  contents: read

jobs:
  changes:
    name: "Detect changes"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      clients: ${{ steps.filter.outputs.clients }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            clients:
              - 'clients/**'
              - 'sdk/cli-commands/**'
              - 'docs/integrate/cli/**'
              - 'docs/openapi/**'
              - 'docs/docs.json'
              - '.github/workflows/test_client.yaml'
              - '.github/actions/setup-clients/**'
              - '.github/workflows/release_cli.yml'

  checks:
    name: "Client: Checks 💅"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      id-token: write

    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: 💅 Format check
        run: pnpm run format:check

      - name: 💅 Lint
        run: pnpm run lint

      - name: 🌍 Validate i18n
        run: pnpm --filter @polar-sh/i18n validate

      - name: 👀 Typecheck
        run: pnpm run typecheck

  test-web:
    name: "Client: Test Web 🧪"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404

    permissions:
      contents: read
      id-token: write

    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: "🧪 Test: Web"
        run: pnpm --filter web test

  test-packages:
    name: "Client: Test Packages 🧪"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404

    permissions:
      contents: read
      id-token: write

    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: "🧪 Test: App"
        run: pnpm --filter @polar-sh/app test

      - name: "🧪 Test: @polar-sh/currency"
        run: pnpm --filter @polar-sh/currency test

      - name: "🧪 Test: @polar-sh/checkout"
        run: pnpm --filter @polar-sh/checkout test

      - name: "🧪 Test: @polar-sh/orbit"
        run: pnpm --filter @polar-sh/orbit test

      - name: "🧪 Test: MCP"
        run: pnpm --filter mcp test

      - name: "🧪 Test: Adapters"
        run: pnpm turbo run test --filter='./adapters/*'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: clients/packages/cli/package.json

      - name: "🧪 Test: CLI"
        run: pnpm --filter @polar-sh/cli test

      - name: "📚 CLI docs are up to date"
        run: pnpm --filter @polar-sh/cli docs:check

  build:
    name: "Client: Build 🛠️"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-8vcpu-ubuntu-2404

    permissions:
      contents: read
      id-token: write

    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VERCEL_ENV: "testing"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clients

      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clients/apps/web/.next/cache
            clients/apps/orbit/.next/cache
          key: next-build-${{ hashFiles('clients/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ hashFiles('clients/pnpm-lock.yaml') }}-

      - name: 🛠️ Build
        run: |
          touch "$RUNNER_TEMP/build-started"
          pnpm build

      - name: Check whether the build wrote to the Next.js build cache
        id: next-cache
        if: github.event_name == 'push'
        run: |
          if [ -n "$(find apps/web/.next/cache apps/orbit/.next/cache -type f -newer "$RUNNER_TEMP/build-started" -print -quit 2>/dev/null)" ]; then
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the Next.js build cache
        if: steps.next-cache.outputs.written == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clients/apps/web/.next/cache
            clients/apps/orbit/.next/cache
          key: next-build-${{ hashFiles('clients/pnpm-lock.yaml') }}-${{ github.sha }}

  cli-binary:
    name: "Client: CLI Binary 📦"
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: clients/packages/cli

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: clients/packages/cli/package.json

      - name: 📦 Install the CLI dependency graph
        run: pnpm --dir ../.. install --filter @polar-sh/cli... --frozen-lockfile --ignore-scripts

      - name: 🛠️ Build @polar-sh/polar
        run: pnpm --dir ../.. --filter @polar-sh/polar build

      - name: 📦 Build binary
        run: bun build ./src/cli.ts --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --define POLAR_CLI_BUILD='"release"' --target=bun-linux-x64 --outfile polar

      - name: 💨 Smoke test binary
        env:
          POLAR_CLI_TELEMETRY_OPTOUT: "1"
        run: ./polar --version

  status:
    name: "Client: Tests 🎨"
    needs: [changes, checks, test-web, test-packages, build, cli-binary]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: .
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done
