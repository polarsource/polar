name: Test Deployment Notifications

on:
  pull_request:
    paths:
      - .github/scripts/deploy-notify/**
      - .github/workflows/deploy*.yml
      - .github/workflows/test_deploy_notify.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/deploy-notify/**
      - .github/workflows/deploy*.yml
      - .github/workflows/test_deploy_notify.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/deploy-notify/*.test.mjs
