name: Test Deployment Notifications

on:
  pull_request:
    paths:
      - .github/scripts/deploy-notify/**
      - .github/workflows/deploy*.yml
      - .github/workflows/test_deploy_notify.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/deploy-notify/**
      - .github/workflows/deploy*.yml
      - .github/workflows/test_deploy_notify.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/deploy-notify/*.test.mjs
