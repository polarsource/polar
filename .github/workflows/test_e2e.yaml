name: "E2E Tests"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL (default: production)"
        type: string
      checkout_link:
        description: "Checkout link client secret (default: the E2E_CHECKOUT_LINK secret)"
        type: string
      test_card:
        description: "Use Stripe's 4242 test card instead of the real card (for sandbox)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: "E2E Tests 🎭"
    timeout-minutes: 40
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      E2E_API_URL: ${{ inputs.api_url || 'https://api.polar.sh' }}
      E2E_CHECKOUT_LINK: ${{ inputs.checkout_link || secrets.E2E_CHECKOUT_LINK }}
      E2E_CARD_NUMBER: ${{ inputs.test_card && '' || secrets.E2E_CARD_NUMBER }}
      E2E_CARD_EXPIRY: ${{ inputs.test_card && '' || secrets.E2E_CARD_EXPIRY }}
      E2E_CARD_CVC: ${{ inputs.test_card && '' || secrets.E2E_CARD_CVC }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: clients/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./clients

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run E2E tests
        run: pnpm --filter web test:e2e
        working-directory: ./clients
        env:
          E2E_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload artifacts
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: clients/apps/web/e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Describe the failure
        id: failure
        if: failure()
        env:
          RESULTS: clients/apps/web/e2e/artifacts/results.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
        run: |
          [ -f "$RESULTS" ] || echo '{"testResults": []}' > "$RESULTS"
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg source "$SOURCE_URL" --arg run "$RUN_URL" \
            --arg artifacts "$ARTIFACT_URL" --arg event "$GITHUB_EVENT_NAME" \
            --arg checkout "$E2E_API_URL/v1/checkout-links/$E2E_CHECKOUT_LINK/redirect" \
            --slurpfile results "$RESULTS" '
            [ $results[0].testResults[] | .name as $file | .assertionResults[] | select(.status == "failed")
              | { name: (.ancestorTitles | join(" › ")), title,
                  error: (.failureMessages[0] | split("\n")[0]),
                  source: ($source + "/" + ($file | sub("^.*/clients/"; "clients/"))
                    + ((.failureMessages[0] | capture("e2e/[^:\\s]+:(?<line>[0-9]+)")? | "#L" + .line) // "")) }
            ] as $failed
            | (if ($failed | length) == 1 then
                 ":bufo-has-activated: E2E test failed: *\($failed[0].name)*: \($failed[0].title) (\($event))"
               elif ($failed | length) > 1 then
                 ":bufo-has-activated: \($failed | length) E2E tests failed (\($event))"
               else
                 ":bufo-has-activated: E2E job failed before any test ran (\($event)), see the run log"
               end) as $header
            | [ $header,
                ($failed[] | (if ($failed | length) > 1 then "*\(.name)*: \(.title)\n" else "" end)
                  + "```\(.error)```\n• <\(.source)|Test source>"),
                "• <\($checkout)|Checkout link> (try it yourself)",
                "• <\($run)|View run>" + (if $artifacts == "" then "" else " · <\($artifacts)|Screenshots and browser logs>" end)
              ] | { channel: $channel, text: join("\n") }' > slack-message.json
          screenshot=$(ls clients/apps/web/e2e/artifacts/*/*/*.png 2>/dev/null | sort | tail -1)
          echo "screenshot=$screenshot" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        id: slack
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: slack-message.json

      - name: Attach the last screenshot
        if: failure() && steps.failure.outputs.screenshot != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
            thread_ts: "${{ steps.slack.outputs.ts }}"
            initial_comment: "Last screenshot before the failure"
            file: ${{ steps.failure.outputs.screenshot }}
            filename: e2e-${{ github.run_id }}.png

      - name: Suggest a re-run
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
            thread_ts: "${{ steps.slack.outputs.ts }}"
            text: "Flaky? `gh run rerun ${{ github.run_id }}`"

      - name: Check provider status
        if: failure()
        env:
          SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ steps.slack.outputs.ts }}
        run: |
          status() {
            curl -s --max-time 10 "$1" | jq -r "$2" 2>/dev/null || true
          }
          table=$(printf '%-11s %s\n' "Provider" "Status" \
            "Stripe"     "$(status https://status.stripe.com/current .message)" \
            "Render"     "$(status https://status.render.com/api/v2/status.json .status.description)" \
            "Vercel"     "$(status https://www.vercel-status.com/api/v2/status.json .status.description)" \
            "Cloudflare" "$(status https://www.cloudflarestatus.com/api/v2/status.json .status.description)" \
            "OpenAI"     "$(status https://status.openai.com/api/v2/status.json .status.description)" \
            "GitHub"     "$(status https://www.githubstatus.com/api/v2/status.json .status.description)")
          echo "$table"
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg ts "$SLACK_THREAD_TS" --arg table "$table" \
            '{channel: $channel, thread_ts: $ts, text: (":satellite: *Provider status right now*\n```" + $table + "```")}' > slack-status.json

      - name: Post provider status
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: slack-status.json

      - name: Analyze the failure
        if: failure()
        working-directory: ./clients/apps/web
        env:
          SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ steps.slack.outputs.ts }}
        run: node e2e/ci/analyze-failure.mts

      - name: Post the analysis
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: clients/apps/web/slack-analysis.json
