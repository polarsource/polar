name: "E2E Tests"

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL (default: sandbox)"
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: "E2E Tests 🎭"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 40
    runs-on: blacksmith-4vcpu-ubuntu-2404

    env:
      E2E_API_URL: ${{ inputs.api_url || 'https://sandbox-api.polar.sh' }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
      E2E_ORG_TOKEN: ${{ secrets.E2E_ORG_TOKEN }}

    steps:
      # Deliberately not pinned to workflow_run.head_sha: checking out a SHA taken
      # from the triggering event runs that code with this workflow's secrets
      # (CodeQL: untrusted checkout). SOURCE_SHA is only used for the source link.
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: clients/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./clients

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
        working-directory: ./clients

      - name: Run E2E tests
        run: pnpm --filter web test:e2e
        working-directory: ./clients

      - name: Redact session tokens from traces and logs
        if: always()
        run: |
          redact() { perl -pi -e 's/polar_cst_[A-Za-z0-9_-]+/polar_cst_REDACTED/g; s/Bearer [A-Za-z0-9._~+\/=-]+/Bearer REDACTED/g' "$@"; }
          shopt -s nullglob
          for trace in clients/apps/web/e2e/artifacts/*/*/trace.zip; do
            unpacked=$(mktemp -d)
            unzip -q "$trace" -d "$unpacked"
            grep -rlI -E 'polar_cst_|Bearer ' "$unpacked" | while read -r file; do redact "$file"; done
            (cd "$unpacked" && zip -qr "$OLDPWD/$trace" .)
            rm -rf "$unpacked"
          done
          for log in clients/apps/web/e2e/artifacts/*/*/browser.log; do redact "$log"; done

      - name: Upload artifacts
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: clients/apps/web/e2e/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Describe the failure
        id: failure
        if: failure()
        env:
          RESULTS: clients/apps/web/e2e/artifacts/results.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ env.SOURCE_SHA }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        run: |
          [ -f "$RESULTS" ] || echo '{"testResults": []}' > "$RESULTS"
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg source "$SOURCE_URL" --arg run "$RUN_URL" \
            --arg artifacts "$ARTIFACT_URL" --arg event "$GITHUB_EVENT_NAME" \
            --slurpfile results "$RESULTS" '
            [ $results[0].testResults[] | .name as $file | .assertionResults[] | select(.status == "failed")
              | { name: (.ancestorTitles | join(" › ")), title,
                  error: (.failureMessages[0] | split("\n")[0]),
                  source: ($source + "/" + ($file | sub("^.*/clients/"; "clients/"))
                    + ((.failureMessages[0] | capture("e2e/[^:\\s]+:(?<line>[0-9]+)")? | "#L" + .line) // "")),
                  checkout: (.meta.checkoutUrl // "") }
            ] as $failed
            | (if ($failed | length) == 1 then
                 ":bufo-has-activated: E2E test failed: *\($failed[0].name)*: \($failed[0].title) (\($event))"
               elif ($failed | length) > 1 then
                 ":bufo-has-activated: \($failed | length) E2E tests failed (\($event))"
               else
                 ":bufo-has-activated: E2E job failed before any test ran (\($event)), see the run log"
               end) as $header
            | [ $header,
                ($failed[] | (if ($failed | length) > 1 then "*\(.name)*: \(.title)\n" else "" end)
                  + "```\(.error)```\n• <\(.source)|Test source>"
                  + (if .checkout == "" then "" else " · <\(.checkout)|Open the checkout>" end)),
                "• <\($run)|View run>" + (if $artifacts == "" then "" else " · <\($artifacts)|Screenshots and browser logs>" end)
                  + " · Trace: drop the zip from this thread on <https://trace.playwright.dev|trace.playwright.dev>"
              ] | { channel: $channel, text: join("\n") }' > slack-message.json
          screenshot=$(ls clients/apps/web/e2e/artifacts/*/*/*.png 2>/dev/null | sort | tail -1)
          echo "screenshot=$screenshot" >> "$GITHUB_OUTPUT"
          trace="$(dirname "${screenshot:-/nonexistent}")/trace.zip"
          if [ -f "$trace" ]; then
            echo "trace=$trace" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on failure
        id: slack
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: slack-message.json

      - name: Attach the last screenshot
        if: failure() && steps.failure.outputs.screenshot != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: ${{ env.SLACK_CHANNEL_ID }}
            thread_ts: "${{ steps.slack.outputs.ts }}"
            initial_comment: "Last screenshot before the failure"
            file: ${{ steps.failure.outputs.screenshot }}
            filename: e2e-${{ github.run_id }}.png

      - name: Attach the trace
        if: failure() && steps.failure.outputs.trace != ''
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: ${{ env.SLACK_CHANNEL_ID }}
            thread_ts: "${{ steps.slack.outputs.ts }}"
            initial_comment: "Playwright trace of the failing attempt: open https://trace.playwright.dev and drop this file on it, or run `pnpm exec playwright show-trace <file>`"
            file: ${{ steps.failure.outputs.trace }}
            filename: e2e-${{ github.run_id }}-trace.zip

      - name: Suggest a re-run
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ env.SLACK_CHANNEL_ID }}
            thread_ts: "${{ steps.slack.outputs.ts }}"
            text: "Flaky? `gh run rerun ${{ github.run_id }}`"

      - name: Check provider status
        if: failure()
        env:
          SLACK_THREAD_TS: ${{ steps.slack.outputs.ts }}
        run: |
          status() {
            curl -s --max-time 10 "$1" | jq -r "$2" 2>/dev/null || true
          }
          table=$(printf '%-11s %s\n' "Provider" "Status" \
            "Stripe"     "$(status https://status.stripe.com/current .message)" \
            "Render"     "$(status https://status.render.com/api/v2/status.json .status.description)" \
            "Vercel"     "$(status https://www.vercel-status.com/api/v2/status.json .status.description)" \
            "Cloudflare" "$(status https://www.cloudflarestatus.com/api/v2/status.json .status.description)" \
            "OpenAI"     "$(status https://status.openai.com/api/v2/status.json .status.description)" \
            "GitHub"     "$(status https://www.githubstatus.com/api/v2/status.json .status.description)")
          echo "$table"
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg ts "$SLACK_THREAD_TS" --arg table "$table" \
            '{channel: $channel, thread_ts: $ts, text: (":satellite: *Provider status right now*\n```" + $table + "```")}' > slack-status.json

      - name: Post provider status
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload-file-path: slack-status.json
