name: Events

on:
  push:
    branches: ["main"]
    paths:
      - "events/**"
      - ".github/workflows/test_events.yaml"
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - "events/**"
      - ".github/workflows/test_events.yaml"

permissions:
  contents: read

jobs:
  events:
    name: "Events: Lint and test"
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./events
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build image
        run: docker build .
