name: Lambda

on:
  push:
    branches: ["main"]
    paths:
      - "lambda/**"
      - ".github/workflows/test_lambda.yaml"
  pull_request:
    types: [opened, synchronize, edited]
    paths:
      - "lambda/**"
      - ".github/workflows/test_lambda.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: "Detect changes"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      server: ${{ steps.filter.outputs.server }}
      migrations: ${{ steps.filter.outputs.migrations }}
      tinybird: ${{ steps.filter.outputs.tinybird }}
      server_files: ${{ steps.filter.outputs.server_files }}
      lambda: ${{ steps.filter.outputs.lambda }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: json
          filters: |
            lambda:
              - 'lambda/**'
              - '.github/workflows/test_lambda.yaml'

  lambda-linters:
    name: "Lambda: Linters"
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        lambda: [image-resizer]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "lambda/${{ matrix.lambda }}/pyproject.toml"

      - name: Install dependencies
        working-directory: ./lambda/${{ matrix.lambda }}
        run: uv sync --frozen

      - name: Lint
        working-directory: ./lambda/${{ matrix.lambda }}
        run: uv run task lint_check

      - name: Type check
        working-directory: ./lambda/${{ matrix.lambda }}
        run: uv run task lint_types

  lambda-tests:
    name: "Lambda: Tests"
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        lambda: [image-resizer]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "lambda/${{ matrix.lambda }}/pyproject.toml"

      - name: Install dependencies
        working-directory: ./lambda/${{ matrix.lambda }}
        run: uv sync --frozen

      - name: Test
        working-directory: ./lambda/${{ matrix.lambda }}
        run: uv run task test
