name: SDK

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'edited' && !github.event.changes.base && format('pr-metadata-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: "Detect changes${{ github.event.action == 'edited' && !github.event.changes.base && ' (PR metadata only)' || '' }}"
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            sdk:
              - 'sdk/**'
              - '.github/workflows/test_sdk.yaml'

  tests:
    name: "SDK: Tests${{ github.event.action == 'edited' && !github.event.changes.base && ' (PR metadata only)' || '' }}"
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      POLAR_EMAIL_RENDERER_BINARY_PATH: "/tmp/email-renderer"
      POLAR_PYDANTIC_AI_GATEWAY_API_KEY: "POLAR_PYDANTIC_AI_GATEWAY_API_KEY"
      E2E_REDIS_URL: "redis://127.0.0.1:6379/0"
    services:
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "sdk/generator/pyproject.toml"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Set up server
        working-directory: ./server
        run: |
          touch /tmp/email-renderer
          uv sync --frozen

      - name: Install generator dependencies
        working-directory: ./sdk/generator
        run: uv sync --frozen

      - name: Lint generator
        working-directory: ./sdk/generator
        run: just lint-check

      - name: Test generator
        working-directory: ./sdk/generator
        run: just test

      # Redis 8.2 or later: the Redis cost tests read each client's bytes from CLIENT LIST.
      - name: Install Redis
        uses: shogo82148/actions-setup-redis@d566e806806d1bac2b414538d57b2b7f721e1d83 # v1.60.0
        with:
          redis-version: "8.2"
          auto-start: false

      - name: Generate and test SDKs
        working-directory: ./sdk/generator
        run: |
          just openapi
          just generate-all

      - name: Install SDK E2E dependencies
        working-directory: ./sdk/e2e
        run: |
          just ci

      - name: Check SDK E2E harness
        working-directory: ./sdk/e2e
        run: |
          just lint
          just typecheck

      - name: Test SDK E2E scenarios
        working-directory: ./sdk/e2e
        run: just test-prebuilt

      - name: Verify bundled Python SDK skill
        working-directory: ./sdk/python
        run: |
          uv build --no-sources
          unzip -Z1 dist/*.whl | grep -Fx 'polar/.agents/skills/polar-python-sdk/SKILL.md'
          unzip -Z1 dist/*.whl | grep -Fx 'polar/.agents/skills/polar-python-sdk/agents/openai.yaml'
          unzip -Z1 dist/*.whl | grep -Fx 'polar/.agents/skills/polar-python-sdk/references/migration-from-v0.md'
          unzip -Z1 dist/*.whl | grep -Fx 'polar/.agents/skills/polar-python-sdk/references/usage-events.md'
          unzip -Z1 dist/*.whl | grep -Fx 'polar/.agents/skills/polar-python-sdk/references/webhooks.md'

      - name: Verify bundled TypeScript SDK skill
        working-directory: ./sdk/typescript
        run: |
          mkdir -p packed
          pnpm pack --ignore-scripts --pack-destination packed
          tar -tzf packed/*.tgz | grep -Fx 'package/.agents/skills/polar-typescript-sdk/SKILL.md'
          tar -tzf packed/*.tgz | grep -Fx 'package/.agents/skills/polar-typescript-sdk/agents/openai.yaml'
          tar -tzf packed/*.tgz | grep -Fx 'package/.agents/skills/polar-typescript-sdk/references/migration-from-v0.md'
          tar -tzf packed/*.tgz | grep -Fx 'package/.agents/skills/polar-typescript-sdk/references/usage-events.md'
          tar -tzf packed/*.tgz | grep -Fx 'package/.agents/skills/polar-typescript-sdk/references/webhooks.md'
