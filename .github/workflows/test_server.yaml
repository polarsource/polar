name: Server

on:
  push:
    branches: ["main", "yopi/speed-up-ci-measurements"]
  pull_request:
    types: [opened, synchronize, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: "Detect changes"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      server: ${{ 'true' }}
      emails: ${{ 'true' }}
      migrations: ${{ steps.filter.outputs.migrations }}
      migration_heads: ${{ steps.filter.outputs.migration_heads }}
      tinybird: ${{ steps.filter.outputs.tinybird }}
      env_vars: ${{ steps.filter.outputs.env_vars }}
      server_files: ${{ steps.filter.outputs.server_files }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'pull_request'
        with:
          sparse-checkout: .github/workflows/test_server.yaml
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          list-files: json
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/test_server.yaml'
            emails:
              - 'server/emails/**'
              - '.github/workflows/test_server.yaml'
            migrations:
              - 'server/migrations/versions/**'
            migration_heads:
              - 'server/migrations/versions/**'
              - 'server/migrations/env.py'
              - 'server/polar/models/**'
              - 'server/polar/kit/db/models/**'
              - 'server/scripts/check_migrations.py'
              - 'server/tests/scripts/test_check_migrations.py'
              - '.github/workflows/test_server.yaml'
            tinybird:
              - 'server/tinybird/**'
            env_vars:
              - 'terraform/**'
              - 'server/**'
              - 'clients/**'

  linters:
    name: "Server: Linters 📝"
    needs: changes
    if: needs.changes.outputs.server == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        id: mypy-python
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        working-directory: ./server
        run: uv sync --dev --frozen

      - name: Restore mypy analysis cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: server/.mypy_cache
          key: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-

      - name: Refresh source timestamps for mypy hash validation
        working-directory: ./server
        run: |
          stamp_file=.mypy_cache/polar-source-mtime
          previous=$(cat "$stamp_file" 2>/dev/null || true)
          if [[ "$previous" =~ ^[1-9][0-9]{0,8}$ ]]; then
            stamp=$((previous + 1))
          else
            rm -rf .mypy_cache
            mkdir -p .mypy_cache
            stamp=1
          fi
          find . -path './.venv' -prune -o -path './.mypy_cache' -prune -o \
            -type f \( -name '*.py' -o -name '*.pyi' \) -exec touch -d "@$stamp" {} +
          printf '%s\n' "$stamp" > "$RUNNER_TEMP/polar-source-mtime"

      - name: 🐶 Lint Server (ruff)
        working-directory: ./server
        run: uv run task lint_check

      - name: 🛟 Type Check Server (mypy)
        working-directory: ./server
        run: uv run task lint_types

      - name: Stamp successful mypy analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/yopi/speed-up-ci-measurements'
        run: cp "$RUNNER_TEMP/polar-source-mtime" server/.mypy_cache/polar-source-mtime

      - name: Save main mypy analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/yopi/speed-up-ci-measurements'
        uses: actions/cache/save@v6.1.0
        with:
          path: server/.mypy_cache
          key: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  emails:
    name: "Server: Emails 📬"
    needs: changes
    if: needs.changes.outputs.emails == 'true'
    timeout-minutes: 10
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/emails/package.json

      - name: 📬 Setup Node.js environment for server/emails
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "server/emails/pnpm-lock.yaml"

      - name: 🔧 pnpm install
        working-directory: server/emails
        run: pnpm install --frozen-lockfile

      - name: 📝 Lint
        working-directory: server/emails
        run: pnpm lint

      - name: 🛟 Type Check
        working-directory: server/emails
        run: pnpm typecheck

  tinybird-check:
    name: "Server: Tinybird Schema 🐦"
    needs: changes
    if: needs.changes.outputs.tinybird == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      tinybird:
        image: tinybirdco/tinybird-local@sha256:f7358a3a289f5a9b2622b84cff4c69032e013306b6b107395580661fa7777666
        ports:
          - 7181:7181
        env:
          TB_LOCAL_CSV_WORKERS: 1
          TB_LOCAL_MCP: false
          TB_LOCAL_KAFKA: false
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:7181/tokens || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: 🐦 Install Tinybird CLI
        run: |
          uv tool install 'tinybird==5.0.3' --python 3.11 --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version=$("$HOME/.local/bin/tb" --version)
          printf '%s\n' "$version"
          test "$version" = 'tb, version 5.0.3 (rev ef090149)'

      - name: 🐦 Validate Tinybird schema
        working-directory: ./server/tinybird
        run: |
          export TB_HOST=http://localhost:7181
          export TB_ADMIN_TOKEN=$(curl -s http://localhost:7181/tokens | jq -r .admin_token)
          tb fmt --diff --no-color datasources/*.datasource pipes/*.pipe endpoints/*.pipe
          tb build
          tb test run

  # Required by the migrations-lock ruleset, toggled by migrations-lock.yml / migrations-unlock.yml
  no-migrations:
    name: "Server: No migrations"
    needs: changes
    if: >-
      vars.MIGRATIONS_LOCKED == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if migrations changed
        if: needs.changes.outputs.migrations == 'true'
        run: |
          echo "::error::This change contains database migrations, which are currently locked."
          exit 1

  migration-check:
    name: "Server: Migration Check 📚"
    needs: changes
    if: needs.changes.outputs.migrations == 'true' && github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check for disallowed files
        id: check
        env:
          SERVER_FILES: ${{ needs.changes.outputs.server_files }}
        run: |
          DISALLOWED=""
          for file in $(echo "$SERVER_FILES" | jq -r '.[]'); do
            # Allow: migrations, models, scripts, and the workflow file itself
            if [[ "$file" == server/migrations/* ]]; then
              continue
            fi
            if [[ "$file" == server/polar/models/* ]]; then
              continue
            fi
            if [[ "$file" == server/scripts/* ]]; then
              continue
            fi
            if [[ "$file" == .github/* ]]; then
              continue
            fi
            DISALLOWED="$DISALLOWED$file\n"
          done

          if [ -n "$DISALLOWED" ]; then
            echo "has_disallowed=true" >> $GITHUB_OUTPUT
            FILES_LIST=$(echo -e "$DISALLOWED" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/')
            echo "files_list<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES_LIST" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_disallowed=false" >> $GITHUB_OUTPUT
          fi

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __MIGRATION_CHECK -->"

      - name: Create or update failure comment
        if: steps.check.outputs.has_disallowed == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- __MIGRATION_CHECK -->
            ## ⚠️ Migration Isolation Check Failed

            This PR contains database migrations along with other code changes. To ensure safe deployments, please split this into separate PRs,
            or verify that your changes will not break. Keep in mind that the API is deployed before the workers.

            1. **Migration PR**: Only model changes and the migration file
            2. **Code PR**: All other changes (can be merged after migration PR)

            ### Files that should be in a separate PR:
            ${{ steps.check.outputs.files_list }}

            ### Why?
            Migrations are deployed separately and run before code changes. Mixing them can cause deployment issues if the new code depends on the migration.

      - name: Delete resolved comment
        if: steps.check.outputs.has_disallowed == 'false' && steps.fc.outputs.comment-id != ''
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.fc.outputs.comment-id }}
            })

      - name: Fail check
        if: steps.check.outputs.has_disallowed == 'true'
        run: exit 1

  env-vars-check:
    name: "Server: Env Var Check 🔑"
    needs: changes
    if: needs.changes.outputs.env_vars == 'true' && github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find POLAR_* variables nothing reads
        id: check
        run: |
          STATUS=0
          OUTPUT=$(python3 server/scripts/check_env_vars.py) || STATUS=$?

          if [ "$STATUS" -gt 1 ]; then
            echo "check_env_vars exited $STATUS" >&2
            exit "$STATUS"
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "has_orphans=false" >> $GITHUB_OUTPUT
          else
            echo "has_orphans=true" >> $GITHUB_OUTPUT
            echo "orphans<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            NAMES=$(echo "$OUTPUT" | grep -oE 'POLAR_[A-Z0-9_]+' | paste -sd' ' -)
            echo "::warning title=Provisioned but never read::$NAMES"
            {
              echo "## 🔑 Env Var Check"
              echo
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __ENV_VAR_CHECK -->"

      - name: Create or update comment
        if: steps.check.outputs.has_orphans == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- __ENV_VAR_CHECK -->
            ## 🔑 Env Var Check

            Terraform provisions these into the app environment, and nothing reads them:

            ```
            ${{ steps.check.outputs.orphans }}
            ```

            A credential nobody reads is a credential nobody watches. Remove them from
            `terraform/`, or add them to `ALLOWED` in `server/scripts/check_env_vars.py`
            with a reason.

            This check does not block the merge.

      - name: Delete resolved comment
        if: steps.check.outputs.has_orphans == 'false' && steps.fc.outputs.comment-id != ''
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.fc.outputs.comment-id }}
            })

  migration-heads:
    name: "Server: Migration heads"
    needs: changes
    if: >-
      needs.changes.outputs.migration_heads == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      POLAR_EMAIL_RENDERER_BINARY_PATH: "/tmp/email-renderer"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create mock email renderer binary
        run: touch /tmp/email-renderer

      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git fetch --depth=1 origin "$BASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        working-directory: ./server
        run: uv sync --frozen --no-dev

      - name: Check Alembic heads, migration filenames, and column drops
        working-directory: ./server
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: uv run python -m scripts.check_migrations --base "$BASE_SHA"

  test:
    name: "Server: Tests 🐍 (${{ matrix.shard == 'tinybird' && 'Tinybird' || format('{0}/4', matrix.shard) }})"
    needs: changes
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "tinybird"]
    runs-on: ${{ matrix.shard == 'tinybird' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    env:
      POLAR_ENV: testing
      POLAR_EMAIL_RENDERER_BINARY_PATH: ${{ github.workspace }}/server/emails/bin/react-email-pkg
      POLAR_TEST_DATABASE_TEMPLATE: polar_test
      POLAR_TEST_XDIST: "true"
      POLAR_TEST_MIGRATION_RESULT: ${{ github.workspace }}/migration-result.json
      POLAR_TEST_TINYBIRD_REQUIRED: ${{ matrix.shard == 'tinybird' && 'true' || 'false' }}

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: polar
          POSTGRES_PASSWORD: polar
          POSTGRES_DB: polar_test
          POSTGRES_PORT: 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: ${{ matrix.shard != 'tinybird' && 'redis:7.4-alpine' || '' }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      tinybird:
        image: ${{ matrix.shard == 'tinybird' && 'tinybirdco/tinybird-local@sha256:f7358a3a289f5a9b2622b84cff4c69032e013306b6b107395580661fa7777666' || '' }}
        ports:
          - 7181:7181
          - 7182:7182
        env:
          TB_LOCAL_CSV_WORKERS: 1
          TB_LOCAL_MCP: false
          TB_LOCAL_KAFKA: false
        options: >-
          --health-cmd "curl -s http://127.0.0.1:7181/tokens || exit 1"
          --health-interval 10s
          --health-start-interval 500ms
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Inspect Tinybird health timing
        if: matrix.shard == 'tinybird'
        run: |
          docker inspect --format '{{json .Config.Healthcheck}}' '${{ job.services.tinybird.id }}'
          docker inspect --format '{{range .State.Health.Log}}{{.Start}} {{.End}} {{.ExitCode}}{{println}}{{end}}' '${{ job.services.tinybird.id }}'

      - name: 📬 Restore emails renderer
        id: emails
        uses: actions/cache@v6.1.0
        with:
          path: server/emails/bin
          key: emails-renderer-${{ runner.os }}-${{ hashFiles('server/emails/src/**', 'server/emails/package.json', 'server/emails/pnpm-lock.yaml', 'server/emails/tsdown.config.mjs', '.nvmrc') }}

      - uses: pnpm/action-setup@v6.1.0
        if: steps.emails.outputs.cache-hit != 'true'
        with:
          package_json_file: server/emails/package.json

      - name: 📬 Setup Node.js environment for server/emails
        if: steps.emails.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "server/emails/pnpm-lock.yaml"

      - name: 📬 Build server/emails
        if: steps.emails.outputs.cache-hit != 'true'
        working-directory: server/emails
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "server/pyproject.toml"

      - name: Cache CJK fonts
        id: cjk-fonts-cache
        uses: actions/cache@v6.1.0
        with:
          path: /usr/share/fonts/opentype/noto
          key: cjk-fonts-${{ runner.os }}-noto-cjk-v1

      - name: Install CJK fonts
        if: steps.cjk-fonts-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 🔧 uv install
        working-directory: ./server
        run: |
          uv sync --dev --frozen

      - name: 🐦 Install Tinybird CLI
        if: matrix.shard == 'tinybird'
        run: |
          uv tool install 'tinybird==5.0.3' --python 3.11 --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version=$("$HOME/.local/bin/tb" --version)
          printf '%s\n' "$version"
          test "$version" = 'tb, version 5.0.3 (rev ef090149)'

      - name: 🐦 Prepare Tinybird workspace
        if: matrix.shard == 'tinybird'
        working-directory: ./server
        run: |
          token_file="$RUNNER_TEMP/tinybird-token"
          rm -f "$token_file" "$token_file.error"
          nohup uv run python -m scripts.tinybird_test_workspace --token-file "$token_file" > "$RUNNER_TEMP/tinybird-prepare.log" 2>&1 &

      - name: ⚗️ Start fresh database migrations
        id: migrations
        working-directory: ./server
        env:
          CHECK_SCHEMA: ${{ matrix.shard == '1' && '--check' || '' }}
        run: |
          rm -f "$POLAR_TEST_MIGRATION_RESULT"
          check_args=()
          if [[ "$CHECK_SCHEMA" = "--check" ]]; then check_args=(--check); fi
          nohup uv run python -m scripts.ci_migrate --result-file "$POLAR_TEST_MIGRATION_RESULT" "${check_args[@]}" > "$RUNNER_TEMP/migrations.log" 2>&1 &

      - name: 📊 Restore test durations
        if: matrix.shard != 'tinybird'
        uses: actions/cache/restore@v6.1.0
        with:
          path: server/.test_durations
          key: test-durations-${{ github.sha }}
          restore-keys: test-durations-261fcc4641051bd7dfb22864b6fe8410b7c89305

      - name: Restore pytest bytecode
        id: pytest-bytecode
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/pytest-bytecode
          key: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ matrix.shard }}-

      - name: Prepare pytest bytecode
        working-directory: ./server
        run: uv run python -m scripts.pytest_bytecode restore --cache "$RUNNER_TEMP/pytest-bytecode"

      - name: 🐍 Run tests (pytest)
        if: matrix.shard != 'tinybird'
        working-directory: ./server
        run: |
          uv run python -m scripts.pytest_shards --shards 4 --shard ${{ matrix.shard }} > "$RUNNER_TEMP/test-files"
          weights=()
          if [[ -f .test_durations ]]; then weights=(--weights "$PWD/.test_durations"); fi
          PYTHONPATH="$GITHUB_WORKSPACE/.github:$PWD" POLAR_TEST_FILES="$RUNNER_TEMP/test-files" uv run python -m ci_pool --workers 8 --timeout 840 --output "$RUNNER_TEMP/pytest-pool" "${weights[@]}" -- tests '-m=not tinybird and not benchmark' --no-cov --durations=40
          cp "$RUNNER_TEMP/pytest-pool/.test_durations" .test_durations
          cp "$RUNNER_TEMP/pytest-pool/junit.xml" "$RUNNER_TEMP/junit.xml"

      - name: Record Tinybird service CPU before tests
        if: matrix.shard == 'tinybird'
        env:
          TINYBIRD_ID: ${{ job.services.tinybird.id }}
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TINYBIRD_ID" cat /sys/fs/cgroup/cpu.stat > "$RUNNER_TEMP/tinybird-cpu-before"
          docker exec "$POSTGRES_ID" cat /sys/fs/cgroup/cpu.stat > "$RUNNER_TEMP/postgres-cpu-before"

      - name: 🐦 Run Tinybird tests (pytest)
        if: matrix.shard == 'tinybird'
        working-directory: ./server
        env:
          POLAR_TEST_TINYBIRD_TOKEN_FILE: ${{ runner.temp }}/tinybird-token
        run: |
          uv run python -m scripts.pytest_shards --tinybird > "$RUNNER_TEMP/test-files"
          CI_STARTUP_OUTPUT="$RUNNER_TEMP/tinybird-startup.json" POLAR_TEST_FILES="$RUNNER_TEMP/test-files" uv run python "$GITHUB_WORKSPACE/.github/ci_startup_probe.py" -m "tinybird and not benchmark" -n 0 --no-cov --durations=40 --junitxml="$RUNNER_TEMP/junit.xml"

      - name: Record Tinybird service CPU after tests
        if: always() && matrix.shard == 'tinybird'
        env:
          TINYBIRD_ID: ${{ job.services.tinybird.id }}
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$TINYBIRD_ID" cat /sys/fs/cgroup/cpu.stat > "$RUNNER_TEMP/tinybird-cpu-after"
          docker exec "$POSTGRES_ID" cat /sys/fs/cgroup/cpu.stat > "$RUNNER_TEMP/postgres-cpu-after"

      - name: Upload Tinybird startup diagnostics
        if: always() && matrix.shard == 'tinybird'
        uses: actions/upload-artifact@v7
        with:
          name: tinybird-startup
          path: |
            ${{ runner.temp }}/tinybird-startup.json
            ${{ runner.temp }}/tinybird-cpu-*
            ${{ runner.temp }}/postgres-cpu-*
            ${{ runner.temp }}/tinybird-workspace.prof
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Record shared-startup evidence
        if: always() && matrix.shard != 'tinybird'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-pool-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-pool
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: ⚗️ Verify database migrations
        if: always() && !cancelled() && steps.migrations.outcome == 'success'
        working-directory: ./server
        run: |
          uv run python -m scripts.ci_migrations --result-file "$POLAR_TEST_MIGRATION_RESULT"
          cat "$RUNNER_TEMP/migrations.log"

      - name: Wait for ordinary timing artifacts
        if: github.event_name == 'push' && matrix.shard == 'tinybird'
        uses: actions/github-script@v9
        with:
          script: |
            const expected = new Set(Array.from({length: 4}, (_, i) => `Server: Tests 🐍 (${i + 1}/4)`));
            const parameters = {...context.repo, run_id: context.runId};
            const {data: run} = await github.rest.actions.getWorkflowRun(parameters);
            if (run.head_sha !== context.sha || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
              throw new Error('Timing artifacts must belong to this workflow run and attempt');
            }
            const deadline = Date.now() + 300_000;
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...parameters, filter: 'latest', per_page: 100});
              const shards = jobs.filter(job => expected.has(job.name));
              if (new Set(shards.map(job => job.name)).size !== shards.length || shards.some(job => job.head_sha !== context.sha)) {
                throw new Error('Timing artifact job identities do not match');
              }
              if (shards.some(job => job.status === 'completed' && job.conclusion !== 'success')) {
                throw new Error('Ordinary tests failed; use Re-run failed jobs to retry tests and timing publication');
              }
              if (shards.length === expected.size && shards.every(job => job.status === 'completed' && job.conclusion === 'success')) {
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Timed out waiting for all four ordinary test jobs');

      - name: 📊 Download shard test durations
        if: github.event_name == 'push' && matrix.shard == 'tinybird'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-durations-*
          path: ${{ runner.temp }}/test-durations

      - name: 📊 Merge shard test durations
        if: github.event_name == 'push' && matrix.shard == 'tinybird'
        working-directory: ./server
        run: uv run python -m scripts.merge_test_durations --expected-shards 4 --output .test_durations "$RUNNER_TEMP"/test-durations/*/.test_durations

      - name: 💾 Save merged test durations
        if: github.event_name == 'push' && matrix.shard == 'tinybird'
        uses: actions/cache/save@v6.1.0
        with:
          path: server/.test_durations
          key: test-durations-${{ github.sha }}

      - name: Store pytest bytecode
        if: steps.pytest-bytecode.outputs.cache-hit != 'true'
        working-directory: ./server
        run: uv run python -m scripts.pytest_bytecode store --cache "$RUNNER_TEMP/pytest-bytecode"

      - name: Save pytest bytecode
        if: steps.pytest-bytecode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/pytest-bytecode
          key: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ matrix.shard }}-${{ github.sha }}

      - name: 📊 Upload shard test durations
        if: github.event_name == 'push' && matrix.shard != 'tinybird'
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.shard }}
          path: server/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test-status:
    name: "Server: Tests 🐍"
    needs: [changes, test]
    if: ${{ always() && !(needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.changes.result == 'success')) }}
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
