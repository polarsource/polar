name: Server

on:
  push:
    branches: ["main", "yopi/speed-up-ci-measurements"]
  pull_request:
    types: [opened, synchronize, edited]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: "Detect changes"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      server: ${{ steps.filter.outputs.server }}
      emails: ${{ steps.filter.outputs.emails }}
      migrations: ${{ steps.filter.outputs.migrations }}
      migration_heads: ${{ steps.filter.outputs.migration_heads }}
      tinybird: ${{ steps.filter.outputs.tinybird }}
      env_vars: ${{ steps.filter.outputs.env_vars }}
      server_files: ${{ steps.filter.outputs.server_files }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'pull_request'
        with:
          sparse-checkout: .github/workflows/test_server.yaml
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          list-files: json
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/test_server.yaml'
              - '.github/workflows/test_server_shard.yaml'
            emails:
              - 'server/emails/**'
              - '.github/workflows/test_server.yaml'
              - '.github/workflows/test_server_shard.yaml'
            migrations:
              - 'server/migrations/versions/**'
            migration_heads:
              - 'server/migrations/versions/**'
              - 'server/migrations/env.py'
              - 'server/polar/models/**'
              - 'server/polar/kit/db/models/**'
              - 'server/scripts/check_migrations.py'
              - 'server/tests/scripts/test_check_migrations.py'
              - '.github/workflows/test_server.yaml'
              - '.github/workflows/test_server_shard.yaml'
            tinybird:
              - 'server/tinybird/**'
            env_vars:
              - 'terraform/**'
              - 'server/**'
              - 'clients/**'

  linters:
    name: "Server: Linters 📝"
    permissions:
      contents: read
      actions: read
    needs: changes
    if: needs.changes.outputs.server == 'true'
    timeout-minutes: 15
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        id: mypy-python
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        working-directory: ./server
        run: uv sync --dev --frozen

      - name: Restore mypy analysis cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: server/.mypy_cache
          key: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-

      - name: Refresh source timestamps for mypy hash validation
        working-directory: ./server
        run: |
          stamp_file=.mypy_cache/polar-source-mtime
          previous=$(cat "$stamp_file" 2>/dev/null || true)
          if [[ "$previous" =~ ^[1-9][0-9]{0,8}$ ]]; then
            stamp=$((previous + 1))
          else
            rm -rf .mypy_cache
            mkdir -p .mypy_cache
            stamp=1
          fi
          find . -path './.venv' -prune -o -path './.mypy_cache' -prune -o \
            -type f \( -name '*.py' -o -name '*.pyi' \) -exec touch -d "@$stamp" {} +
          printf '%s\n' "$stamp" > "$RUNNER_TEMP/polar-source-mtime"

      - name: 🐶 Lint Server (ruff)
        working-directory: ./server
        run: uv run task lint_check

      - name: 🛟 Type Check Server (mypy)
        working-directory: ./server
        run: uv run task lint_types

      - name: Stamp successful mypy analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/yopi/speed-up-ci-measurements'
        run: cp "$RUNNER_TEMP/polar-source-mtime" server/.mypy_cache/polar-source-mtime

      - name: Save main mypy analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/yopi/speed-up-ci-measurements'
        uses: actions/cache/save@v6.1.0
        with:
          path: server/.mypy_cache
          key: mypy-next-experiment-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mypy-python.outputs.python-version }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for test timing artifacts
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const number = job => job.name.match(/Server shard ([123])$/)?.[1];
            const parameters = {...context.repo, run_id: context.runId};
            const {data: run} = await github.rest.actions.getWorkflowRun(parameters);
            if (run.head_sha !== context.sha || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
              throw new Error('Timing artifacts must belong to this workflow run and attempt');
            }
            const deadline = Date.now() + 300_000;
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...parameters, filter: 'latest', per_page: 100});
              const shards = jobs.filter(job => number(job) !== undefined);
              if (new Set(shards.map(number)).size !== shards.length || shards.some(job => job.head_sha !== context.sha)) {
                throw new Error('Timing artifact job identities do not match');
              }
              if (shards.some(job => job.status === 'completed' && job.conclusion !== 'success')) {
                throw new Error('Tests failed; use Re-run failed jobs to retry tests and timing publication');
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...parameters, per_page: 100});
              const available = shards.length === 3 && shards.every(job => {
                const shard = number(job);
                const matching = artifacts.filter(artifact => artifact.name === `test-results-${shard}` && !artifact.expired);
                if (matching.length > 1) { throw new Error('Duplicate timing artifacts'); }
                return matching.length === 1 && matching[0].workflow_run.head_sha === context.sha &&
                  Date.parse(matching[0].created_at) >= Date.parse(job.started_at);
              });
              if (available) { return; }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Timed out waiting for three fresh timing artifacts');

      - name: 📊 Download shard test durations
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/test-durations

      - name: 📊 Merge shard test durations
        if: github.event_name == 'push'
        working-directory: ./server
        run: |
          for durations in "$RUNNER_TEMP"/test-durations/*/.test_durations; do
            expected_workers=8
            if [[ "$(basename "$(dirname "$durations")")" = 'test-results-1' ]]; then expected_workers=4; fi
            jq -e --argjson workers "$expected_workers" '.failed == false and .workers == $workers' "$(dirname "$durations")/summary.json" > /dev/null
          done
          uv run python -m scripts.merge_test_durations --expected-shards 3 --output .test_durations "$RUNNER_TEMP"/test-durations/*/.test_durations

      - name: 💾 Save merged test durations
        if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: server/.test_durations
          key: test-durations-${{ github.sha }}

  emails:
    name: "Server: Emails 📬"
    needs: changes
    if: needs.changes.outputs.emails == 'true'
    timeout-minutes: 10
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: server/emails/package.json

      - name: 📬 Setup Node.js environment for server/emails
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "server/emails/pnpm-lock.yaml"

      - name: 🔧 pnpm install
        working-directory: server/emails
        run: pnpm install --frozen-lockfile

      - name: 📝 Lint
        working-directory: server/emails
        run: pnpm lint

      - name: 🛟 Type Check
        working-directory: server/emails
        run: pnpm typecheck

  tinybird-check:
    name: "Server: Tinybird Schema 🐦"
    needs: changes
    if: needs.changes.outputs.tinybird == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      tinybird:
        image: tinybirdco/tinybird-local@sha256:f7358a3a289f5a9b2622b84cff4c69032e013306b6b107395580661fa7777666
        ports:
          - 7181:7181
        env:
          TB_LOCAL_CSV_WORKERS: 1
          TB_LOCAL_MCP: false
          TB_LOCAL_KAFKA: false
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:7181/tokens || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: 🐦 Install Tinybird CLI
        run: |
          uv tool install 'tinybird==5.0.3' --python 3.11 --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version=$("$HOME/.local/bin/tb" --version)
          printf '%s\n' "$version"
          test "$version" = 'tb, version 5.0.3 (rev ef090149)'

      - name: 🐦 Validate Tinybird schema
        working-directory: ./server/tinybird
        run: |
          export TB_HOST=http://localhost:7181
          export TB_ADMIN_TOKEN=$(curl -s http://localhost:7181/tokens | jq -r .admin_token)
          tb fmt --diff --no-color datasources/*.datasource pipes/*.pipe endpoints/*.pipe
          tb build
          tb test run

  # Required by the migrations-lock ruleset, toggled by migrations-lock.yml / migrations-unlock.yml
  no-migrations:
    name: "Server: No migrations"
    needs: changes
    if: >-
      vars.MIGRATIONS_LOCKED == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if migrations changed
        if: needs.changes.outputs.migrations == 'true'
        run: |
          echo "::error::This change contains database migrations, which are currently locked."
          exit 1

  migration-check:
    name: "Server: Migration Check 📚"
    needs: changes
    if: needs.changes.outputs.migrations == 'true' && github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check for disallowed files
        id: check
        env:
          SERVER_FILES: ${{ needs.changes.outputs.server_files }}
        run: |
          DISALLOWED=""
          for file in $(echo "$SERVER_FILES" | jq -r '.[]'); do
            # Allow: migrations, models, scripts, and the workflow file itself
            if [[ "$file" == server/migrations/* ]]; then
              continue
            fi
            if [[ "$file" == server/polar/models/* ]]; then
              continue
            fi
            if [[ "$file" == server/scripts/* ]]; then
              continue
            fi
            if [[ "$file" == .github/* ]]; then
              continue
            fi
            DISALLOWED="$DISALLOWED$file\n"
          done

          if [ -n "$DISALLOWED" ]; then
            echo "has_disallowed=true" >> $GITHUB_OUTPUT
            FILES_LIST=$(echo -e "$DISALLOWED" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/')
            echo "files_list<<EOF" >> $GITHUB_OUTPUT
            echo "$FILES_LIST" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_disallowed=false" >> $GITHUB_OUTPUT
          fi

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __MIGRATION_CHECK -->"

      - name: Create or update failure comment
        if: steps.check.outputs.has_disallowed == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- __MIGRATION_CHECK -->
            ## ⚠️ Migration Isolation Check Failed

            This PR contains database migrations along with other code changes. To ensure safe deployments, please split this into separate PRs,
            or verify that your changes will not break. Keep in mind that the API is deployed before the workers.

            1. **Migration PR**: Only model changes and the migration file
            2. **Code PR**: All other changes (can be merged after migration PR)

            ### Files that should be in a separate PR:
            ${{ steps.check.outputs.files_list }}

            ### Why?
            Migrations are deployed separately and run before code changes. Mixing them can cause deployment issues if the new code depends on the migration.

      - name: Delete resolved comment
        if: steps.check.outputs.has_disallowed == 'false' && steps.fc.outputs.comment-id != ''
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.fc.outputs.comment-id }}
            })

      - name: Fail check
        if: steps.check.outputs.has_disallowed == 'true'
        run: exit 1

  env-vars-check:
    name: "Server: Env Var Check 🔑"
    needs: changes
    if: needs.changes.outputs.env_vars == 'true' && github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find POLAR_* variables nothing reads
        id: check
        run: |
          STATUS=0
          OUTPUT=$(python3 server/scripts/check_env_vars.py) || STATUS=$?

          if [ "$STATUS" -gt 1 ]; then
            echo "check_env_vars exited $STATUS" >&2
            exit "$STATUS"
          fi

          if [ "$STATUS" -eq 0 ]; then
            echo "has_orphans=false" >> $GITHUB_OUTPUT
          else
            echo "has_orphans=true" >> $GITHUB_OUTPUT
            echo "orphans<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            NAMES=$(echo "$OUTPUT" | grep -oE 'POLAR_[A-Z0-9_]+' | paste -sd' ' -)
            echo "::warning title=Provisioned but never read::$NAMES"
            {
              echo "## 🔑 Env Var Check"
              echo
              echo '```'
              echo "$OUTPUT"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __ENV_VAR_CHECK -->"

      - name: Create or update comment
        if: steps.check.outputs.has_orphans == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- __ENV_VAR_CHECK -->
            ## 🔑 Env Var Check

            Terraform provisions these into the app environment, and nothing reads them:

            ```
            ${{ steps.check.outputs.orphans }}
            ```

            A credential nobody reads is a credential nobody watches. Remove them from
            `terraform/`, or add them to `ALLOWED` in `server/scripts/check_env_vars.py`
            with a reason.

            This check does not block the merge.

      - name: Delete resolved comment
        if: steps.check.outputs.has_orphans == 'false' && steps.fc.outputs.comment-id != ''
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.fc.outputs.comment-id }}
            })

  migration-heads:
    name: "Server: Migration heads"
    needs: changes
    if: >-
      needs.changes.outputs.migration_heads == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      POLAR_EMAIL_RENDERER_BINARY_PATH: "/tmp/email-renderer"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create mock email renderer binary
        run: touch /tmp/email-renderer

      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git fetch --depth=1 origin "$BASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        working-directory: ./server
        run: uv sync --frozen --no-dev

      - name: Check Alembic heads, migration filenames, and column drops
        working-directory: ./server
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: uv run python -m scripts.check_migrations --base "$BASE_SHA"

  test-1:
    name: "Server: Tests 🐍 (1/3)"
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/test_server_shard.yaml
    with:
      shard: "1"

  test-2:
    name: "Server: Tests 🐍 (2/3)"
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/test_server_shard.yaml
    with:
      shard: "2"

  test-3:
    name: "Server: Tests 🐍 (3/3)"
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/test_server_shard.yaml
    with:
      shard: "3"

  test-status:
    name: "Server: Tests 🐍"
    needs: [changes, test-1, test-2, test-3]
    if: >-
      ${{ always() && !(needs.changes.result == 'success' &&
        needs.test-1.result == 'success' && needs.test-2.result == 'success' && needs.test-3.result == 'success' &&
        needs.test-1.outputs.server_changed == needs.changes.outputs.server &&
        needs.test-2.outputs.server_changed == needs.changes.outputs.server &&
        needs.test-3.outputs.server_changed == needs.changes.outputs.server) }}
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
