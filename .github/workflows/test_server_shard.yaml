name: Server Test Shard

on:
  workflow_call:
    inputs:
      shard:
        type: string
        required: true
    outputs:
      server_changed:
        value: ${{ jobs.test.outputs.server_changed }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test:
    name: Server shard ${{ inputs.shard }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      server_changed: ${{ steps.filter.outputs.server }}
    env:
      POLAR_ENV: testing
      POLAR_EMAIL_RENDERER_BINARY_PATH: ${{ github.workspace }}/server/emails/bin/react-email-pkg
      POLAR_TEST_DATABASE_TEMPLATE: polar_test
      POLAR_TEST_XDIST: "true"
      POLAR_TEST_MIGRATION_RESULT: ${{ github.workspace }}/migration-result.json
      POLAR_TEST_TINYBIRD_REQUIRED: ${{ inputs.shard == '1' && 'true' || 'false' }}

      POLAR_TEST_SERVICES_RESULT: ${{ github.workspace }}/services-result.json
      POLAR_TEST_SERVICE_PREFIX: polar-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.shard }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/test_server.yaml'
              - '.github/workflows/test_server_shard.yaml'

      - name: Install uv
        if: steps.filter.outputs.server == 'true'
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Start services alongside setup
        if: steps.filter.outputs.server == 'true'
        id: services
        working-directory: ./server
        run: |
          tinybird=()
          if [[ '${{ inputs.shard }}' = '1' ]]; then tinybird=(--tinybird); fi
          nohup uv run --no-project --python "$(command -v python3)" python scripts/ci_services.py start --prefix "$POLAR_TEST_SERVICE_PREFIX" --result-file "$POLAR_TEST_SERVICES_RESULT" "${tinybird[@]}" > "$RUNNER_TEMP/services.log" 2>&1 &

      - name: 📬 Restore emails renderer
        if: steps.filter.outputs.server == 'true'
        id: emails
        uses: actions/cache@v6.1.0
        with:
          path: server/emails/bin
          key: emails-renderer-${{ runner.os }}-${{ hashFiles('server/emails/src/**', 'server/emails/package.json', 'server/emails/pnpm-lock.yaml', 'server/emails/tsdown.config.mjs', '.nvmrc') }}

      - uses: pnpm/action-setup@v6.1.0
        if: steps.emails.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        with:
          package_json_file: server/emails/package.json

      - name: 📬 Setup Node.js environment for server/emails
        if: steps.emails.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: "server/emails/pnpm-lock.yaml"

      - name: 📬 Build server/emails
        if: steps.emails.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        working-directory: server/emails
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set up Python
        if: steps.filter.outputs.server == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "server/pyproject.toml"

      - name: Cache CJK fonts
        if: steps.filter.outputs.server == 'true'
        id: cjk-fonts-cache
        uses: actions/cache@v6.1.0
        with:
          path: /usr/share/fonts/opentype/noto
          key: cjk-fonts-${{ runner.os }}-noto-cjk-v1

      - name: Install CJK fonts
        if: steps.cjk-fonts-cache.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 🔧 uv install
        if: steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: |
          uv sync --dev --frozen

      - name: 🐦 Install Tinybird CLI
        if: inputs.shard == '1' && steps.filter.outputs.server == 'true'
        run: |
          uv tool install 'tinybird==5.0.3' --python 3.11 --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          version=$("$HOME/.local/bin/tb" --version)
          printf '%s\n' "$version"
          test "$version" = 'tb, version 5.0.3 (rev ef090149)'

      - name: 🐦 Prepare Tinybird workspace
        if: inputs.shard == '1' && steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: |
          token_file="$RUNNER_TEMP/tinybird-token"
          rm -f "$token_file" "$token_file.error"
          nohup uv run python -m scripts.tinybird_test_workspace --token-file "$token_file" > "$RUNNER_TEMP/tinybird-prepare.log" 2>&1 &

      - name: ⚗️ Start fresh database migrations
        if: steps.filter.outputs.server == 'true'
        id: migrations
        working-directory: ./server
        env:
          CHECK_SCHEMA: ${{ inputs.shard == '1' && '--check' || '' }}
        run: |
          rm -f "$POLAR_TEST_MIGRATION_RESULT"
          check_args=()
          if [[ "$CHECK_SCHEMA" = "--check" ]]; then check_args=(--check); fi
          nohup uv run python -m scripts.ci_migrate --result-file "$POLAR_TEST_MIGRATION_RESULT" --services-result-file "$POLAR_TEST_SERVICES_RESULT" "${check_args[@]}" > "$RUNNER_TEMP/migrations.log" 2>&1 &

      - name: 📊 Restore test durations
        if: steps.filter.outputs.server == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: server/.test_durations
          key: test-durations-22d075aeae3134412e012008cfc9b4cfac78b365
          restore-keys: test-durations-261fcc4641051bd7dfb22864b6fe8410b7c89305

      - name: Restore pytest bytecode
        if: steps.filter.outputs.server == 'true'
        id: pytest-bytecode
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/pytest-bytecode
          key: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ inputs.shard }}-${{ github.sha }}
          restore-keys: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ inputs.shard }}-

      - name: Prepare pytest bytecode
        if: steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: uv run python -m scripts.pytest_bytecode restore --cache "$RUNNER_TEMP/pytest-bytecode"

      - name: 🐍 Run tests (pytest)
        if: steps.filter.outputs.server == 'true'
        working-directory: ./server
        env:
          POLAR_TEST_TINYBIRD_TOKEN_FILE: ${{ runner.temp }}/tinybird-token
        run: |
          uv run python -m scripts.pytest_shards --shards 4 --workers-per-shard 3,8,8,8 --shard ${{ inputs.shard }} > "$RUNNER_TEMP/ordinary-files"
          cp "$RUNNER_TEMP/ordinary-files" "$RUNNER_TEMP/test-files"
          weights=()
          extra=()
          marker='not tinybird and not benchmark'
          if [[ -f .test_durations ]]; then weights=(--weights "$PWD/.test_durations"); fi
          if [[ '${{ inputs.shard }}' = '1' ]]; then
            uv run python -m scripts.pytest_shards --tinybird >> "$RUNNER_TEMP/test-files"
            sort -u "$RUNNER_TEMP/test-files" -o "$RUNNER_TEMP/test-files"
            extra=(--ordinary-files "$RUNNER_TEMP/ordinary-files")
            marker='not benchmark'
          fi
          POLAR_TEST_FILES="$RUNNER_TEMP/test-files" uv run python -m scripts.pytest_pool --workers ${{ inputs.shard == '1' && '4' || '8' }} --timeout 840 --output "$RUNNER_TEMP/pytest-pool" "${weights[@]}" "${extra[@]}" --marker "$marker" tests
          cp "$RUNNER_TEMP/pytest-pool/.test_durations" .test_durations

      - name: Collect setup logs
        if: always() && steps.filter.outputs.server == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-pool"
          if [[ -f "$RUNNER_TEMP/tinybird-token" ]]; then stat --format='%y' "$RUNNER_TEMP/tinybird-token" > "$RUNNER_TEMP/pytest-pool/tinybird-ready-time"; fi
          for log in services migrations tinybird-prepare; do
            if [[ -f "$RUNNER_TEMP/$log.log" ]]; then cp "$RUNNER_TEMP/$log.log" "$RUNNER_TEMP/pytest-pool/$log.log"; fi
          done
          if [[ -f "$POLAR_TEST_SERVICES_RESULT" ]]; then cp "$POLAR_TEST_SERVICES_RESULT" "$RUNNER_TEMP/pytest-pool/services-result.json"; fi
          tinybird=()
          if [[ '${{ inputs.shard }}' = '1' ]]; then tinybird=(--tinybird); fi
          uv run --no-project --python "$(command -v python3)" python server/scripts/ci_services.py stats --prefix "$POLAR_TEST_SERVICE_PREFIX" --result-file "$RUNNER_TEMP/pytest-pool/service-cpu.json" "${tinybird[@]}"

      - name: Upload test reports and timings
        if: always() && steps.filter.outputs.server == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.shard }}
          path: ${{ runner.temp }}/pytest-pool
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: ⚗️ Verify database migrations
        if: always() && !cancelled() && steps.migrations.outcome == 'success' && steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: |
          uv run python -m scripts.ci_migrations --result-file "$POLAR_TEST_MIGRATION_RESULT"
          cat "$RUNNER_TEMP/migrations.log"

      - name: Store pytest bytecode
        if: steps.pytest-bytecode.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: uv run python -m scripts.pytest_bytecode store --cache "$RUNNER_TEMP/pytest-bytecode"

      - name: Save pytest bytecode
        if: steps.pytest-bytecode.outputs.cache-hit != 'true' && steps.filter.outputs.server == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/pytest-bytecode
          key: pytest-bytecode-v1-${{ runner.os }}-${{ hashFiles('server/uv.lock', 'server/pyproject.toml', 'server/scripts/pytest_bytecode.py') }}-${{ inputs.shard }}-${{ github.sha }}

      - name: Stop test services
        if: always() && steps.services.outcome == 'success' && steps.filter.outputs.server == 'true'
        working-directory: ./server
        run: uv run --no-project --python "$(command -v python3)" python scripts/ci_services.py stop --prefix "$POLAR_TEST_SERVICE_PREFIX"

