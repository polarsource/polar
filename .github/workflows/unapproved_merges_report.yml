name: Unapproved merges report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Collect PRs merged without approval
        id: collect
        uses: actions/github-script@v9
        with:
          script: |
            const now = new Date();
            const today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const daysSinceMonday = (today.getUTCDay() + 6) % 7;
            const lastMonday = new Date(today);
            lastMonday.setUTCDate(today.getUTCDate() - daysSinceMonday - 7);
            const lastSunday = new Date(lastMonday);
            lastSunday.setUTCDate(lastMonday.getUTCDate() + 6);
            const isoDate = (d) => d.toISOString().slice(0, 10);
            const start = isoDate(lastMonday);
            const end = isoDate(lastSunday);

            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:pr is:merged merged:${start}..${end}`;
            const prs = [];
            let cursor = null;
            while (true) {
              const { search } = await github.graphql(
                `query($searchQuery: String!, $cursor: String) {
                  search(query: $searchQuery, type: ISSUE, first: 100, after: $cursor) {
                    pageInfo { hasNextPage, endCursor }
                    nodes {
                      ... on PullRequest {
                        number
                        title
                        url
                        mergedAt
                        author { login }
                        labels(first: 20) { nodes { name } }
                        reviews(states: APPROVED, first: 100) {
                          nodes { author { login, __typename } }
                        }
                      }
                    }
                  }
                }`,
                { searchQuery, cursor },
              );
              prs.push(...search.nodes);
              if (!search.pageInfo.hasNextPage) break;
              cursor = search.pageInfo.endCursor;
            }

            const isEmergency = (pr) => pr.labels.nodes.some((label) => label.name === 'emergency-merge');
            const APPROVER_BOTS = ['cubic-dev-ai'];
            const hasApproval = (pr) =>
              pr.reviews.nodes.some((r) => r.author?.__typename === 'User' || APPROVER_BOTS.includes(r.author?.login));
            const summarize = (pr) => ({
              number: pr.number,
              title: pr.title,
              url: pr.url,
              mergedAt: pr.mergedAt,
              login: pr.author?.login ?? null,
            });
            const emergency = prs.filter(isEmergency).map(summarize);
            const unapproved = prs.filter((pr) => !isEmergency(pr) && !hasApproval(pr)).map(summarize);

            core.info(
              `${prs.length} PR(s) merged ${start}..${end}: ${emergency.length} emergency merge(s), ` +
              `${unapproved.length} other without approval`,
            );
            core.setOutput('report', JSON.stringify({ emergency, unapproved }));
            core.setOutput('count', String(emergency.length + unapproved.length));
            core.setOutput('window_start', start);
            core.setOutput('window_end', end);

      - name: Post report to Slack
        if: steps.collect.outputs.count != '0'
        uses: actions/github-script@v9
        env:
          SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C093CJXJXPT
          REVIEWER_SLACK_ID: U06QWNPA23V
          REPORT: ${{ steps.collect.outputs.report }}
          WINDOW_START: ${{ steps.collect.outputs.window_start }}
          WINDOW_END: ${{ steps.collect.outputs.window_end }}
        with:
          script: |
            const { emergency, unapproved } = JSON.parse(process.env.REPORT);
            const formatDate = (iso) =>
              new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
            const mergedDay = (iso) =>
              new Date(iso).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });

            const count = (n, noun) => `${n} ${noun}${n === 1 ? '' : 's'}`;
            const header =
              `:memo: *${count(emergency.length, 'emergency merge')} and ${count(unapproved.length, 'other PR')} ` +
              `merged without approval last week ` +
              `(${formatDate(process.env.WINDOW_START)} – ${formatDate(process.env.WINDOW_END)})*`;
            const line = (pr) =>
              `• <${pr.url}|#${pr.number}: ${pr.title}> — ${pr.login ?? 'unknown'} (merged ${mergedDay(pr.mergedAt)})`;
            const lines = [];
            if (emergency.length) {
              lines.push('*Emergency merges* (`/emergency` — skipped review and checks)', ...emergency.map(line));
            }
            if (unapproved.length) {
              lines.push('*Other merges without an approval* (no engineer or Cubic review)', ...unapproved.map(line));
            }

            const section = (text) => ({ type: 'section', text: { type: 'mrkdwn', text } });
            const blocks = [section(header)];
            let chunk = [];
            let chunkLength = 0;
            for (const line of lines) {
              if (chunk.length && chunkLength + line.length + 1 > 2900) {
                blocks.push(section(chunk.join('\n')));
                chunk = [];
                chunkLength = 0;
              }
              chunk.push(line);
              chunkLength += line.length + 1;
            }
            blocks.push(section(chunk.join('\n')));
            blocks.push(
              section(
                `<@${process.env.REVIEWER_SLACK_ID}> please look through the emergency merges. If they all look ` +
                'fine, react with :white_check_mark:. If one of them caused an incident or affected customers, ' +
                'it needs a postmortem.',
              ),
            );

            const response = await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
              },
              body: JSON.stringify({
                channel: process.env.SLACK_CHANNEL,
                text: `${emergency.length} emergency merge(s) and ${unapproved.length} other unapproved merge(s) last week`,
                blocks,
              }),
            });

            const result = await response.json();
            if (!result.ok) {
              core.setFailed(`Slack notification failed: ${result.error}`);
            }

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            {
              "channel": "C093CJXJXPT",
              "text": "Unapproved merges report failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Unapproved merges report failed* — the weekly report could not be generated or posted.\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>*"
                  }
                }
              ]
            }
