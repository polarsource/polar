name: Polar billing config

on:
  pull_request:
    paths: [polar.config.ts]
  push:
    branches: [main]
    paths: [polar.config.ts]

env:
  POLAR_PREVIEW: '1'

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: curl -fsSL https://polar.sh/install.sh | bash
      - name: Plan
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_READ_TOKEN }}
          NO_COLOR: '1'
        run: |
          set -o pipefail
          polar config plan | tee plan.txt
      - name: Comment the plan on the pull request
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: polar-plan
          path: plan.txt

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: curl -fsSL https://polar.sh/install.sh | bash
      - name: Apply
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_WRITE_TOKEN }}
        run: polar config apply --yes
