packages:
  - apps/*
  - adapters/*
  - packages/*
  - examples/*
  - scripts/*

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  openapi-typescript: true
  '@shopify/react-native-skia': true
  '@google/genai': false
  core-js: false
  msw: false
  protobufjs: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@polar-sh/sdk'
  - 'expo@57.0.25'
  - '@expo/ui@57.0.20'
  - 'expo-auth-session@57.0.13'
  - 'expo-insights@57.0.20'
  - 'expo-linking@57.0.11'
  - 'expo-notifications@57.0.21'
  - 'expo-router@57.0.23'
  - 'expo-glass-effect@57.0.4'
  - 'babel-preset-expo@57.0.13'
  - 'expo-modules-core@57.0.19'
  - '@expo/cli@57.0.27'
  - 'expo-modules-jsi@57.1.1'
  - '@expo/router-server@57.0.11'

