[package]
name = "events"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.2", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "1.3.1"
aws-sdk-secretsmanager = { version = "1.128.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-sqs = { version = "1.121.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.2", default-features = false, features = ["rustls-ring"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
ipnet = "2.12.2"
logfire = { version = "0.13.1", default-features = false, features = ["export-http-protobuf"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots", "uuid", "json", "chrono", "bigdecimal"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "6.0.0" }
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "ingest"
harness = false
