[package]
name = "events"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
logfire = { version = "0.13.1", default-features = false, features = ["export-http-protobuf"] }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots", "uuid"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
