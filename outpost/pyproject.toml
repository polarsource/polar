[project]
name = "outpost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
preview = true
extend-select = ["I", "TRY", "UP"]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"
