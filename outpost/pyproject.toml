[project]
name = "outpost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio",
    "httpx2[ws]>=2.13.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "fakeredis[lua]>=2.38.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
preview = true
extend-select = ["I", "TRY", "UP"]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"
