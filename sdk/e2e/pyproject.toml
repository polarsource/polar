[project]
name = "polar-sdk-e2e"
version = "0.1.0"
description = "Cross-language Outpost SDK scenario harness"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0.0",
    "polar-sdk[outpost]",
    "httpx>=0.28.1",
    "redis>=5.0.4",
    "pytest-xdist[psutil]>=3.8.0",
    "starlette>=0.47.0",
    "uvicorn>=0.35.0",
    "wsproto>=1.3.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.16", "ty>=0.0.44"]

[tool.uv]
package = false
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.uv.sources]
polar-sdk = { path = "../python", editable = true }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ty.environment]
python-version = "3.11"
