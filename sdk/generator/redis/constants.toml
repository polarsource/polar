# Durations are in milliseconds unless otherwise noted.

# Shared timeouts and reconnection
# How long an operation waits on Redis or Polar before giving up.
timeout = 5000
reconnect_delay = 100
max_reconnect_delay = 2000

# Outbox delivery
# Events per ingest request a flusher sends Polar.
outbox_batch = 1000
# Flushers that drain the outbox at once, across instances: one per batch waiting.
# Backoff controls when the fleet retries if Polar cannot keep up.
outbox_flushers = 32
# How long a batch sits unacknowledged before another flusher can claim it.
outbox_claim_idle = 60000
# How long a flusher holds its slot. Each batch it delivers extends it.
outbox_flusher_lock_ttl = 30000
# How often a long-running instance drains the stream.
outbox_drain_interval = 1000
# How long the fleet waits to retry after Polar fails to take a batch. The delay doubles
# after each failure up to the maximum, unless Polar specifies a wait.
outbox_retry_delay = 1000
outbox_max_retry_delay = 60000

# Outpost storage and reads
# A new key layout starts cold from Polar's snapshot.
outpost_key_version = "outpost:v1"
# A reducer bucket, in microseconds.
outpost_bucket_size = 300000000
# How long a cold read waits for the customer's first snapshot.
outpost_snapshot_timeout = 5000
# How often a read waiting for a snapshot or another instance's pull checks Redis.
outpost_poll_interval = 25

# Outpost snapshot fetching and reconciliation
# How long a confirm request waits. On timeout, the snapshot applies with events still pending.
outpost_confirm_timeout = 2000
# Pending IDs per confirm request.
outpost_confirm_batch = 1000
# Identities per meter usage request.
outpost_snapshot_batch = 500
# How long an instance gathers cold customers for a single batch of snapshot requests.
outpost_fetch_batch_window = 10
# Batches of cold customers the instance holding the queue requests at once.
outpost_fetch_concurrency = 3
# Initial wait before retrying a batch of cold customers. The delay doubles after each failure.
outpost_fetch_retry_delay = 100

# Outpost change polling
# Polar sets the interval with each pull. This value applies until the first pull.
outpost_pull_interval = 30000
# How long an instance that froze mid-pull keeps the others from pulling.
outpost_pull_lock_ttl = 10000
# A failed pull or unknown customer waits this long before the next try.
# The delay doubles after each failure, up to the maximum.
outpost_pull_retry_delay = 1000
outpost_max_pull_retry_delay = 30000
outpost_pull_limit = 500
# Customers whose snapshots apply concurrently during a pull. Each customer's apply runs in order.
outpost_pull_concurrency = 16
outpost_pull_check_interval = 1000

# Outpost telemetry
# How often an instance pushes its telemetry exports to Redis.
outpost_report_interval = 30000
# One span in this many goes to Polar. Spans with errors or drift always go.
outpost_span_sample_rate = 10
# Exports each telemetry list holds while no instance pulls.
outpost_telemetry_cap = 1000
# How long a relay holds the telemetry lock, enough for two relays at their timeout.
outpost_relay_lock_ttl = 30000
