# Polar MCP — Gram toolset definition
#
# Single source of truth for the Gram-hosted Polar MCP server(s). The tool set
# and overrides below are defined ONCE and applied to every target in `targets`
# (sandbox + production share identical tools; only their coordinates differ).
#
# Sync model (planned CI step):
#   gram push (OpenAPI source `source_slug`, once for the project)
#   then for each target MCP:
#     toolsets.update         (tool_urns = the included set)
#     variations.upsertGlobal  (title/description per tool)
# Each target's toolset is resolved at runtime by matching `mcp_slug` against
# /rpc/toolsets.list — no toolset slugs to hardcode.
#
# Tool identity: entries under `tools` are the URN suffix after "tools:http:polar:".
# Gram derives it from the source slug (`polar`) + the OpenAPI operationId, so the
# names are stable as long as the source slug and operationIds don't change. The
# sync script must validate every name against /rpc/tools.list and fail loudly on
# an unknown tool rather than silently dropping it.
#
# Regenerate/verify the tools+overrides from a live toolset with:
#   ./sdk/gram/bootstrap_manifest.py < toolset.get.json

# ---------------------------------------------------------------------------
# Shared coordinates — identical for every target (same Gram org, project, and
# API key). The key is NEVER stored here: `api_key_env` names the CI secret.
# ---------------------------------------------------------------------------
org: polar
project: default
api_key_env: GRAM_API_KEY
source_slug: polar   # OpenAPI source pushed by `gram push`

# ---------------------------------------------------------------------------
# MCP servers kept in sync. Same tools/overrides applied to each; the toolset
# behind each is found by its `mcp_slug`. `server_url` is informational (which
# Polar API the MCP targets — configured on the Gram environment, not by sync).
# ---------------------------------------------------------------------------
targets:
  - mcp_slug: polar-mcp        # production
    server_url: https://api.polar.sh
  - mcp_slug: polar-sandbox    # sandbox
    server_url: https://sandbox-api.polar.sh

# ---------------------------------------------------------------------------
# Exposed tools (42), shared across all targets. Grouped by resource for
# readability only; order is not significant. Anything NOT listed is excluded.
# ---------------------------------------------------------------------------
tools:
  # Customers
  - polar_customers_list
  - polar_customers_create
  - polar_customers_get
  - polar_customers_get_external
  - polar_customers_get_state
  - polar_customers_get_state_external
  - polar_customers_get_balance
  - polar_customers_update
  - polar_customers_update_external
  - polar_customers_delete
  - polar_customers_delete_external
  - polar_customers_export

  # Products
  - polar_products_list
  - polar_products_get
  - polar_products_create
  - polar_products_update
  - polar_products_update_benefits

  # Orders
  - polar_orders_list
  - polar_orders_get
  - polar_orders_update
  - polar_orders_invoice
  - polar_orders_generate_invoice

  # Subscriptions
  - polar_subscriptions_list
  - polar_subscriptions_get
  - polar_subscriptions_update
  - polar_subscriptions_revoke
  - polar_subscriptions_export

  # Payments
  - polar_payments_list
  - polar_payments_get

  # Customer meters
  - polar_customer_meters_list
  - polar_customer_meters_get

  # Metrics
  - polar_metrics_get
  - polar_metrics_limits

  # Webhooks
  - polar_webhooks_list_webhook_endpoints
  - polar_webhooks_get_webhook_endpoint
  - polar_webhooks_create_webhook_endpoint
  - polar_webhooks_update_webhook_endpoint
  - polar_webhooks_delete_webhook_endpoint
  - polar_webhooks_reset_webhook_endpoint_secret
  - polar_webhooks_list_webhook_deliveries
  - polar_webhooks_redeliver_webhook_event

  # Organizations
  - polar_organizations_list

# ---------------------------------------------------------------------------
# Display overrides, shared across all targets. Only tools whose MCP
# name/description should differ from the OpenAPI operation need an entry;
# everything else inherits from the source spec.
# ---------------------------------------------------------------------------
overrides:
  polar_products_create:
    title: Create product
    description: Create a new product with pricing and benefits (entitlements).

  polar_products_list:
    title: List products
    description: List all products in your organization.

  polar_products_get:
    title: Get product
    description: Retrieve a specific product by ID.

  polar_products_update:
    title: Update product
    description: Update an existing product's details, pricing, or settings.

  polar_products_update_benefits:
    title: Update product benefits
    description: Update which benefits are granted when a product is purchased.

  polar_customers_create:
    title: Create customer
    description: Create a new customer record with email, name, metadata, and optional external_id for reconciliation.

  polar_subscriptions_list:
    title: List subscriptions
    description: List active subscriptions.

  polar_subscriptions_get:
    title: Get subscription details
    description: Get a subscription by ID.

  polar_subscriptions_revoke:
    title: Revoke subscription
