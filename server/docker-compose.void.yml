name: polar-void

services:
  temporal:
    image: temporalio/temporal:latest
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:${POLAR_VOID_TEMPORAL_PORT:-7333}:7233"
      - "127.0.0.1:${POLAR_VOID_TEMPORAL_UI_PORT:-8333}:8233"
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 2s
      timeout: 10s
      retries: 30

  tinybird:
    image: tinybirdco/tinybird-local:latest
    ports:
      - "127.0.0.1:${POLAR_VOID_TINYBIRD_PORT:-7281}:7181"
    volumes:
      - tinybird_clickhouse:/var/lib/clickhouse
      - tinybird_redis:/redis-data
      - tinybird_minio:/var/lib/minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7181/"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  temporal_data:
  tinybird_clickhouse:
  tinybird_redis:
  tinybird_minio:
